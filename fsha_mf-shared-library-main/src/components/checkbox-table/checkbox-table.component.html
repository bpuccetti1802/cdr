<!-- eslint-disable @angular-eslint/template/no-inline-styles -->
<ng-container *ngIf="cardWrapper; else noCardWrapper">
  <app-rc-card-wrapper width="full" [h100]="false">
    <div class="table-container">
      <ng-container *ngTemplateOutlet="tableContent"></ng-container>
    </div>
  </app-rc-card-wrapper>
</ng-container>

<ng-template #noCardWrapper>
  <div class="table-wrapper">
    <div class="table-container">
      <ng-container *ngTemplateOutlet="tableContent"></ng-container>
    </div>
  </div>
</ng-template>

<ng-template #tableContent>
  <div #actionDropdown class="rc-dropdown rc-dropdown-position shadow p-3">
    <div *ngIf="actionComponent; else actionDropdownListDefault">
      <ng-container>
        <ng-container
          *ngComponentOutlet="actionComponent; injector: actionComponentChildInjector"
        ></ng-container>
      </ng-container>
    </div>
    <ng-template #actionDropdownListDefault>
      <ul
        class="rc-link-list"
        *ngIf="
          actionView ||
          actionEdit ||
          actionDelete ||
          actionDownload ||
          selectedRow?.actionView ||
          selectedRow?.actionEdit ||
          selectedRow?.actionDelete ||
          selectedRow?.actionDownload
        "
      >
        <!-- Download -->
        <li
          tabindex="0"
          *ngIf="actionDownload"
          class="rc-dropdown-item"
          [class.disabled]="selectedRow?.actionDownload === false"
          [attr.aria-disabled]="selectedRow?.actionDownload === false"
          (click)="selectedRow?.actionDownload === false ? null : onDownload(selectedRow!)"
          (keypress)="selectedRow?.actionDownload === false ? null : onDownload(selectedRow!)"
        >
          Scarica Allegato
        </li>

        <!-- View -->
        <li
          tabindex="0"
          *ngIf="actionView"
          class="rc-dropdown-item"
          [class.disabled]="selectedRow?.actionView === false"
          [attr.aria-disabled]="selectedRow?.actionView === false"
          (click)="selectedRow?.actionView === false ? null : onView(selectedRow!)"
          (keypress)="selectedRow?.actionView === false ? null : onView(selectedRow!)"
        >
          Visualizza
        </li>

        <!-- Edit -->
        <li
          tabindex="0"
          *ngIf="actionEdit"
          class="rc-dropdown-item"
          [class.disabled]="selectedRow?.actionEdit === false"
          [attr.aria-disabled]="selectedRow?.actionEdit === false"
          (click)="selectedRow?.actionEdit === false ? null : onEdit(selectedRow!)"
          (keypress)="selectedRow?.actionEdit === false ? null : onEdit(selectedRow!)"
        >
          Modifica
        </li>

        <!-- Delete -->
        <li
          tabindex="0"
          *ngIf="actionDelete"
          class="rc-dropdown-item"
          [class.disabled]="selectedRow?.actionDelete === false"
          [attr.aria-disabled]="selectedRow?.actionDelete === false"
          (click)="selectedRow?.actionDelete === false ? null : onDelete(selectedRow!)"
          (keypress)="selectedRow?.actionDelete === false ? null : onDelete(selectedRow!)"
        >
          Elimina
        </li>
      </ul>
    </ng-template>
  </div>

  <!-- Spostare componente toggle in  shared -->
  <fieldset *ngIf="useToggleCompact">
    <div class="form-check form-check-inline">
      <div class="toggles">
        <label for="toggleCompatte">
          Riduci altezza righe
          <input type="checkbox" id="toggleCompatte" [(ngModel)]="isCompact" />
          <span class="lever"></span>
        </label>
      </div>
    </div>
  </fieldset>

  <div
    class="rc-wrapper-container table-responsive scrollable-table"
    [ngClass]="{ scrollable: data.length > 5 && itemsPerPage > 5 }"
  >
    <table class="table table-striped table-fixed rc-table-full-width">
      <thead class="bg-primary text-white">
        <tr>
          <th></th>
          <ng-container *ngFor="let column of columns; trackBy: trackByColumn">
            <th *ngIf="!column?.hidden" scope="col">
              <ng-container *ngIf="!column.selectable; else columnCheckbox">
                <div
                  [class]="
                    column.class
                      ? column.class
                      : 'd-flex justify-content-between align-items-center flex-fill'
                  "
                  [style.max-width]="column.maxWidth ? column.maxWidth : null"
                >
                  {{ column.label }}
                  <div *ngIf="enabledSort && onSortChange" class="d-flex flex-column">
                    <div
                      role="button"
                      tabindex="0"
                      (click)="onSortChange(column, 'asc')"
                      (keydown)="onSortChange(column, 'asc')"
                    >
                      <app-rc-icon
                        *ngIf="column.sortDirection === 'asc' || !column.sortDirection"
                        color="white"
                        [id]="'sort-' + column.id"
                        [size]="IconSize.sm"
                        name="it-arrow-up-triangle"
                      ></app-rc-icon>
                    </div>
                    <div
                      role="button"
                      tabindex="0"
                      (click)="onSortChange(column, 'desc')"
                      (keydown)="onSortChange(column, 'desc')"
                    >
                      <app-rc-icon
                        *ngIf="column.sortDirection === 'desc' || !column.sortDirection"
                        color="white"
                        [id]="'sort-' + column.id"
                        [size]="IconSize.sm"
                        name="it-arrow-down-triangle"
                      ></app-rc-icon>
                    </div>
                  </div>
                </div>
              </ng-container>
            </th>
          </ng-container>
          <ng-template #columnCheckbox>
            <app-rc-checkbox
              *ngIf="!singleSelection"
              [bgWhite]="true"
              [color]="checkboxColor"
              [id]="'select-all-' + uid"
              [formControl]="selezionaMultiplaFormControl"
            ></app-rc-checkbox>
          </ng-template>
          <th
            *ngIf="actionComponent || actionEdit || actionDelete || actionView || actionDownload"
            scope="col"
          ></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="data.length === 0">
          <td [attr.colspan]="columns.length + 2" class="text-center">
            {{ emptyTableMessage }}
          </td>
        </tr>
        <tr *ngFor="let row of paginatedData; index as i; trackBy: trackByRow">
          <td></td>
          <td class="align-middle" *ngFor="let column of columns; trackBy: trackByColumnId">
            <ng-container *ngIf="!column?.hidden">
              <ng-container *ngIf="isComponent(row[column.id]); else normalText">
                <!-- Angular Component -->
                <ng-container *ngIf="isAngularComponent(row[column.id]); else checkIfWebComponent">
                  <ng-container
                    *ngComponentOutlet="row[column.id]; injector: createRowInjector(row)"
                  >
                  </ng-container>
                </ng-container>

                <!-- Non Angular Component -->
                <ng-template #checkIfWebComponent>
                  <ng-container *ngIf="renderComponent(row[column.id]); else normalText">
                    <div
                      #placeholder
                      [innerHTML]="renderComponent(row[column.id])"
                      [style.max-width]="column.maxWidth ? column.maxWidth : null"
                      [class]="column.class ? column.class : null"
                    ></div>
                  </ng-container>
                </ng-template>
              </ng-container>
            </ng-container>
            <ng-template #normalText>
              <ng-container *ngIf="!column.selectable; else rowCheckbox">
                <div
                  [title]="row[column.id]"
                  [style.max-width]="column.maxWidth ? column.maxWidth : null"
                  [class]="column.class ? column.class : null"
                >
                  {{ row[column.id] }}
                </div>
              </ng-container>
              <ng-template #rowCheckbox>
                <app-rc-checkbox
                  [color]="checkboxColor"
                  [bgWhite]="true"
                  [id]="'row-' + uid + '-' + ((currentPage - 1) * itemsPerPage + i)"
                  [formControl]="getControlForRow(row)"
                >
                </app-rc-checkbox>
              </ng-template>
            </ng-template>
          </td>
          <td
            *ngIf="
              actionComponent ||
              row?.actionDelete ||
              row?.actionEdit ||
              row?.actionView ||
              row?.actionDownload ||
              actionEdit ||
              actionDelete ||
              actionView ||
              actionDownload
            "
          >
            <button type="button" class="btn rc-btn" (click)="toggleDropdown($event, row)">
              <fa-icon class="icon-style" [icon]="faEllipsisVertical"></fa-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Paginazione -->
  <div class="d-flex justify-content-between align-items-center mt-2">
    <nav aria-label="Page navigation">
      <ul class="pagination mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button
            type="button"
            class="page-link"
            (click)="onPageChange(currentPage - 1)"
            [attr.disabled]="currentPage === 1 ? true : null"
          >
            «
          </button>
        </li>
        <li class="page-item" *ngIf="currentPage > 2">
          <button type="button" class="page-link" (click)="onPageChange(1)">1</button>
        </li>
        <li class="page-item disabled" *ngIf="currentPage > 3">
          <span class="page-link">...</span>
        </li>
        <li
          class="page-item"
          *ngFor="let page of visiblePageNumbers; trackBy: trackByPage"
          [class.active]="page === currentPage"
        >
          <button type="button" class="page-link" (click)="onPageChange(page)">
            <span [class.text-primary]="page === currentPage">{{ page }}</span>
          </button>
        </li>
        <li class="page-item disabled" *ngIf="currentPage < totalPages - 2">
          <span class="page-link">...</span>
        </li>
        <li class="page-item" *ngIf="currentPage < totalPages - 1">
          <button type="button" class="page-link" (click)="onPageChange(totalPages)">
            {{ totalPages }}
          </button>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button
            type="button"
            class="page-link"
            (click)="onPageChange(currentPage + 1)"
            [attr.disabled]="currentPage === totalPages ? true : null"
          >
            »
          </button>
        </li>
      </ul>
    </nav>
    <div>
      Numero totale righe: <b>{{ totalItems || data.length }}</b>
    </div>
    <select
      id="pagination-table"
      class="form-select w-auto border rounded"
      [(ngModel)]="itemsPerPage"
      (change)="onItemsPerPageChange(itemsPerPage)"
    >
      <ng-container
        *ngFor="let elementPerPage of elementPerPageArray; trackBy: trackByElementPerPage"
      >
        <option [ngValue]="elementPerPage">{{ elementPerPage }} Elementi per pagina</option>
      </ng-container>
      <option *ngIf="shouldShowAllItems" [ngValue]="totalItems || data.length">
        Tutti gli elementi
      </option>
    </select>
  </div>
</ng-template>
