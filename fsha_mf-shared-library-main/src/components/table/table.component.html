<!-- eslint-disable @angular-eslint/template/no-inline-styles -->
<ng-container *ngIf="cardWrapper; else noCardWrapper">
  <app-rc-card-wrapper width="full" [h100]="false">
    <div class="table-container">
      <ng-container *ngTemplateOutlet="tableContent"></ng-container>
    </div>
  </app-rc-card-wrapper>
</ng-container>
<ng-template #noCardWrapper>
  <div class="table-wrapper">
    <div class="table-container">
      <ng-container *ngTemplateOutlet="tableContent"></ng-container>
    </div>
  </div>
</ng-template>
<ng-template #tableContent>
  <div #actionDropdown class="rc-dropdown rc-dropdown-position shadow p-3">
    <div *ngIf="actionComponent; else actionDropdownListDefault">
      <ng-container>
        <ng-container
          *ngComponentOutlet="actionComponent; injector: actionComponentChildInjector"
        ></ng-container>
      </ng-container>
    </div>
    <ng-template #actionDropdownListDefault>
      <ul
        class="rc-link-list"
        *ngIf="
          actionView ||
          actionEdit ||
          actionDelete ||
          actionDownload ||
          selectedRow?.actionView ||
          selectedRow?.actionEdit ||
          selectedRow?.actionDelete ||
          selectedRow?.actionDownload
        "
      >
        <!-- Download -->
        <li
          tabindex="0"
          *ngIf="actionDownload"
          class="rc-dropdown-item"
          [class.disabled]="selectedRow?.actionDownload === false"
          [attr.aria-disabled]="selectedRow?.actionDownload === false"
          (click)="selectedRow?.actionDownload === false ? null : onDownload(selectedRow!)"
          (keypress)="selectedRow?.actionDownload === false ? null : onDownload(selectedRow!)"
        >
          Scarica Allegato
        </li>
        <!-- View -->
        <li
          tabindex="0"
          *ngIf="actionView || selectedRow?.actionView"
          class="rc-dropdown-item"
          [class.disabled]="selectedRow?.actionView === false"
          [attr.aria-disabled]="selectedRow?.actionView === false"
          (click)="selectedRow?.actionView === false ? null : onView(selectedRow!)"
          (keypress)="selectedRow?.actionView === false ? null : onView(selectedRow!)"
        >
          Visualizza
        </li>
        <!-- Edit -->
        <li
          tabindex="0"
          *ngIf="actionEdit || selectedRow?.actionEdit"
          class="rc-dropdown-item"
          [class.disabled]="selectedRow?.actionEdit === false"
          [attr.aria-disabled]="selectedRow?.actionEdit === false"
          (click)="selectedRow?.actionEdit === false ? null : onEdit(selectedRow!)"
          (keypress)="selectedRow?.actionEdit === false ? null : onEdit(selectedRow!)"
        >
          Modifica
        </li>
        <!-- Delete -->
        <li
          tabindex="0"
          *ngIf="actionDelete || selectedRow?.actionDelete"
          class="rc-dropdown-item"
          [class.disabled]="selectedRow?.actionDelete === false"
          [attr.aria-disabled]="selectedRow?.actionDelete === false"
          (click)="selectedRow?.actionDelete === false ? null : onDelete(selectedRow!)"
          (keypress)="selectedRow?.actionDelete === false ? null : onDelete(selectedRow!)"
        >
          Elimina
        </li>
      </ul>
    </ng-template>
  </div>

  <div class="d-flex justify-content-between w-100 align-items-center mb-2">
    <!-- Spostare componente toggle in  shared -->
    <fieldset *ngIf="useToggleCompact">
      <div class="form-check form-check-inline">
        <div class="toggles">
          <label [for]="id + 'toggleCompatte'">
            Riduci altezza righe
            <input
              type="checkbox"
              [id]="id + 'toggleCompatte'"
              [checked]="isCompact"
              (change)="toggleCompact()"
            />
            <span class="lever"></span>
          </label>
        </div>
      </div>
    </fieldset>
    <div>
      <!-- BUTTON RELOAD DATA -->
      <button
        type="button"
        class="btn btn-secondary me-3 p-2 px-3"
        (click)="onReloadDataCallback()"
        title="Ricarca dati"
        aria-label="Ricarica Dati"
        *ngIf="reloadDataCallback"
      >
        <div class="d-inline-block">
          <app-rc-icon name="fa-rotate" alt="Ricarica Dati" color="white" aria-hidden="true" />
        </div>
        <span class="ps-2">Ricarica Dati</span>
      </button>
      <!-- BUTTON COLUMS -->
      <button
        type="button"
        class="btn btn-secondary p-2 px-3"
        (click)="toggleColumnsMenu($event)"
        title="Configura colonne visibili"
        aria-label="Configura colonne visibili"
        *ngIf="useManageColumnsVisibility"
      >
        <div class="d-inline-block">
          <app-rc-image
            name="colums.png"
            alt="Icona colonne tabella"
            aria-hidden="true"
            [width]="22"
            [height]="22"
          />
        </div>
        <span class="ps-2">Configura colonne</span>
      </button>
      <!-- BUTTON EXPORT EXCEL -->
      <button
        type="button"
        class="btn btn-success ms-3 p-2 px-3"
        (click)="onExportExcelCallback()"
        title="Esporta Righe Tabella"
        aria-label="Esporta .xlsx"
        *ngIf="exportExcelCallback"
      >
        <div class="d-inline-block">
          <app-rc-icon name="fa-download" alt="download" color="white" aria-hidden="true" />
        </div>
        <span class="ps-2">Excel</span>
      </button>
      <button
        type="button"
        class="btn btn-primary ms-3 p-2 px-3"
        (click)="onExportPdfCallback()"
        title="Esporta Righe Tabella"
        aria-label="Esporta .pdf"
        *ngIf="exportPdfCallback"
      >
        <div class="d-inline-block">
          <app-rc-icon name="fa-download" alt="download" color="white" aria-hidden="true" />
        </div>
        <span class="ps-2">PDF</span>
      </button>
    </div>
  </div>

  <div #columnsDropdown class="rc-dropdown rc-dropdown-position shadow rc-columns-popover">
    <div class="rc-columns-popover__header">
      <div class="rc-columns-popover__title mf-font-w6 mf-font-size-20">
        Configura colonne visibili
      </div>

      <button
        type="button"
        class="btn rc-btn rc-columns-popover__close"
        aria-label="Chiudi"
        (click)="closeColumnsMenu()"
      >
        <app-rc-icon name="it-close" [size]="IconSize.md" aria-hidden="true"></app-rc-icon>
      </button>
    </div>

    <form [formGroup]="columnsForm">
      <div class="rc-columns-popover__list">
        <ng-container
          *ngFor="let ctrl of columnsArray.controls; let i = index; trackBy: trackByIndex"
        >
          <app-rc-checkbox
            class="rc-columns-popover__item"
            [id]="columns[i].id!"
            [label]="columns[i].label"
            [useValue]="false"
            [formControl]="ctrl"
            [disabled]="ctrl.disabled"
            (change)="onColumnVisiilityChange()"
          ></app-rc-checkbox>
        </ng-container>
      </div>
    </form>
  </div>

  <div
    class="rc-wrapper-container table-responsive scrollable-table"
    [ngClass]="{ scrollable: data.length > 5 && itemsPerPage > 5 }"
  >
    <table
      class="table table-fixed rc-table-full-width"
      [class.table-striped]="!(groupByList || []).length"
      [ngClass]="{ 'table-compact': isCompact }"
    >
      <!-- <table
      class="table table-striped table-fixed rc-table-full-width"
      [ngClass]="{ 'table-compact': isCompact }"
    > -->
      <thead class="bg-primary text-white">
        <tr>
          <th *ngIf="!groupByList?.length"></th>
          <ng-container *ngFor="let column of visibleColumns; trackBy: trackByColumn">
            <th *ngIf="!column?.hidden" scope="col" class="align-middle">
              <div
                [style.width]="column.width ? column.width : null"
                [style.max-width]="column.maxWidth ? column.maxWidth : null"
                [class]="
                  column.class
                    ? column.class
                    : 'd-flex justify-content-between align-items-center flex-fill'
                "
              >
                {{ column.label }}
                <div *ngIf="enabledSort && onSortChange" class="d-flex flex-column">
                  <div
                    role="button"
                    tabindex="0"
                    (click)="onSortChange(column, 'asc')"
                    (keydown)="onSortChange(column, 'asc')"
                  >
                    <app-rc-icon
                      *ngIf="column.sortDirection === 'asc' || !column.sortDirection"
                      color="white"
                      [id]="'sort-' + column.id"
                      [size]="IconSize.sm"
                      name="it-arrow-up-triangle"
                    ></app-rc-icon>
                  </div>
                  <div
                    role="button"
                    tabindex="0"
                    (click)="onSortChange(column, 'desc')"
                    (keydown)="onSortChange(column, 'desc')"
                  >
                    <app-rc-icon
                      *ngIf="column.sortDirection === 'desc' || !column.sortDirection"
                      color="white"
                      [id]="'sort-' + column.id"
                      [size]="IconSize.sm"
                      name="it-arrow-down-triangle"
                    ></app-rc-icon>
                  </div>
                </div>
              </div>
            </th>
          </ng-container>
          <th
            scope="col"
            *ngIf="
              (actionComponent || actionEdit || actionDelete || actionView || actionDownload) &&
              visibleColumns.length > 0
            "
          ></th>
        </tr>
      </thead>

      <ng-template #cellContent let-row="row" let-column="column">
        <ng-container *ngIf="isComponent(row[column.id]); else normalText">
          <!-- Angular Component -->
          <ng-container *ngIf="isAngularComponent(row[column.id]); else checkIfWebComponent">
            <ng-container *ngIf="asAngularComponent(row[column.id]) as cmp">
              <ng-container
                *ngComponentOutlet="cmp; injector: createRowInjector(row)"
              ></ng-container>
            </ng-container>
          </ng-container>

          <!-- Non Angular Component -->
          <ng-template #checkIfWebComponent>
            <ng-container *ngIf="renderComponent(row[column.id]); else normalText">
              <div
                #placeholder
                [innerHTML]="renderComponent(row[column.id])"
                [style.width]="column.width ? column.width : null"
                [style.max-width]="column.maxWidth ? column.maxWidth : null"
                [class]="column.class ? column.class : null"
              ></div>
            </ng-container>
          </ng-template>
        </ng-container>

        <ng-template #normalText>
          <div
            [title]="row[column.id]"
            [style.width]="column.width ? column.width : null"
            [style.max-width]="column.maxWidth ? column.maxWidth : null"
            [class]="column.class ? column.class : null"
          >
            {{ row[column.id] }}
          </div>
        </ng-template>
      </ng-template>

      <tbody>
        <tr *ngIf="paginatedData.length === 0">
          <td [attr.colspan]="columnsNotHidden.length + 2" class="text-center">
            {{ emptyTableMessage }}
          </td>
        </tr>
        <tr *ngFor="let row of paginatedData; let r = index; trackBy: trackByRow">
          <td *ngIf="!groupByList?.length"></td>
          <ng-container *ngFor="let column of visibleColumns; trackBy: trackByColumnId">
            <ng-container *ngIf="!column?.hidden">
              <!-- Colonna raggruppata -->
              <td
                *ngIf="isGrouped(column.id) && getRowSpan(r, column.id) > 0"
                [attr.rowspan]="getRowSpan(r, column.id) || null"
              >
                <ng-container
                  *ngTemplateOutlet="cellContent; context: { row: row, column: column }"
                >
                </ng-container>
              </td>

              <!-- Colonna NON raggruppata -->
              <td *ngIf="!isGrouped(column.id)" class="align-middle">
                <ng-container
                  *ngTemplateOutlet="cellContent; context: { row: row, column: column }"
                >
                </ng-container>
              </td>
            </ng-container>
          </ng-container>
          <td
            *ngIf="
              actionComponent ||
              row?.actionComponent ||
              row?.actionDelete ||
              row?.actionEdit ||
              row?.actionView ||
              row?.actionDownload ||
              actionEdit ||
              actionDelete ||
              actionView ||
              actionDownload
            "
          >
            <button
              type="button"
              class="btn rc-btn"
              (click)="toggleActionsDropdown($event, row)"
              *ngIf="
                shouldValidateVisibility
                  ? row?.actionComponent || row?.actionDelete || row?.actionEdit || row?.actionView
                  : actionComponent ||
                    row?.actionComponent ||
                    row?.actionDelete ||
                    row?.actionEdit ||
                    row?.actionView ||
                    row?.actionDownload ||
                    actionEdit ||
                    actionDelete ||
                    actionView ||
                    actionDownload
              "
            >
              <fa-icon class="icon-style" [icon]="faEllipsisVertical"></fa-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- Paginazione -->
  <div class="d-flex justify-content-between align-items-center mt-2">
    <nav aria-label="Page navigation">
      <ul class="pagination mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button
            type="button"
            class="page-link"
            (click)="onPageChange(currentPage - 1)"
            [attr.disabled]="currentPage === 1 ? true : null"
          >
            «
          </button>
        </li>
        <li class="page-item" *ngIf="currentPage > 2">
          <button type="button" class="page-link" (click)="onPageChange(1)">1</button>
        </li>
        <li class="page-item disabled" *ngIf="currentPage > 3">
          <span class="page-link">...</span>
        </li>
        <li
          class="page-item"
          *ngFor="let page of visiblePageNumbers; trackBy: trackByPage"
          [class.active]="page === currentPage"
        >
          <button type="button" class="page-link" (click)="onPageChange(page)">
            <span [class.text-primary]="page === currentPage">{{ page }}</span>
          </button>
        </li>
        <li class="page-item disabled" *ngIf="currentPage < totalPages - 2">
          <span class="page-link">...</span>
        </li>
        <li class="page-item" *ngIf="currentPage < totalPages - 1">
          <button type="button" class="page-link" (click)="onPageChange(totalPages)">
            {{ totalPages }}
          </button>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button
            type="button"
            class="page-link"
            (click)="onPageChange(currentPage + 1)"
            [attr.disabled]="currentPage === totalPages ? true : null"
          >
            »
          </button>
        </li>
      </ul>
    </nav>
    <div>
      Numero totale righe: <b>{{ totalItems || data.length }}</b>
    </div>
    <select
      id="pagination-table"
      class="form-select w-auto border rounded"
      [(ngModel)]="itemsPerPage"
      (change)="onItemsPerPageChange(itemsPerPage)"
    >
      <ng-container
        *ngFor="let elementPerPage of elementPerPageArray; trackBy: trackByElementPerPage"
      >
        <option [ngValue]="elementPerPage">{{ elementPerPage }} Elementi per pagina</option>
      </ng-container>
      <option *ngIf="shouldShowAllItems" [ngValue]="totalItems || data.length">
        Tutti gli elementi
      </option>
    </select>
  </div>
</ng-template>
