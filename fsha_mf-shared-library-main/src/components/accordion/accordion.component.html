<div class="accordion shadow" [id]="'accordionExampleHa'  + id">
  <div class="accordion-item p-2">
    <h2 class="accordion-header" [id]="'heading1b' + id">
      <button class="accordion-button collapsed" [class.collapsed]="!expanded" type="button" data-bs-toggle="collapse"
        (click)="toggle()" [attr.data-bs-target]="'#collapse1b-' + id" aria-expanded="false"
        [attr.aria-controls]="'collapse1b-' + id">
        {{ title }}
        <ng-container *ngIf="useIcons; else singleIconTemplate">
          <div *ngFor="let icon of icons; trackBy: trackByIcon" class="px-2" [attr.title]="icon.iconTitle">
            <app-rc-icon [name]="icon.iconName" [color]="icon.iconColor" [size]="IconSize.sm">
            </app-rc-icon>
          </div>
        </ng-container>
        <ng-template #singleIconTemplate>
          <div *ngIf="iconName && iconColor" [attr.title]="iconTitle" class="px-2">
            <app-rc-icon [name]="iconName" [color]="iconColor" [size]="IconSize.sm">
            </app-rc-icon>
          </div>
        </ng-template>
      </button>
    </h2>
    <div [id]="'collapse1b-' + id" [ngClass]="{ 'show': expanded }" class="accordion-collapse collapse p-4"
      [attr.data-bs-parent]="'#accordionExampleHa'  + id" role="region" [attr.aria-labelledby]="'heading1b' + id">
      <div class="accordion-body">
        <!-- Caso locale con ng-content -->
        <ng-content *ngIf="!useDynamicContent"></ng-content>
        <slot *ngIf="expanded && !useDynamicContent"></slot>

        <!-- Caso dinamico remoto -->
        <ng-container #contentContainer></ng-container>
      </div>
    </div>
  </div>
</div>
