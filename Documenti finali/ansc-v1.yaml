  /ansc/v1/back-office/atti/{idAtto}/azioni:
    parameters:
      - $ref: '#/components/parameters/IdAtto'
    post:
      operationId: creaAzione
      summary: Registra un'azione di back-office sull'atto
      description: |
        Registra sull'atto un'azione non dispositiva del back-office: instradarlo a un altro
        ufficiale, annotarlo, marcarlo come preso in carico.

        Si usa dalla vista di supervisione, sul dettaglio dell'atto.

        **Le scritture verso ANSC non passano di qui.** Deposito, firme e annullamento sono operazioni
        presidiate del percorso di formazione e vivono sotto `/ansc/v1/atti`. Questa collezione
        raccoglie soltanto ciò che resta locale.

        La sottorisorsa generica `azioni` è una deroga consapevole al modello per sostantivi
        deverbali, ammessa dallo standard per operazioni rare ed eterogenee fra loro.

        **Effetti**: modifica lo stato locale dell'atto e registra una voce di audit. Ripetibile.
      tags: [atti]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AzioneRichiesta' }
            examples:
              esempioInstradamento:
                summary: Instradamento a un altro ufficiale
                value:
                  codTipoAzione: INSTRADA
                  operatoreDestinatario: BNCLRA82C41H501K
                  note: Competenza del Municipio I
      responses:
        '201':
          description: Azione registrata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/Azione' }
        '400':
          description: Tipo di azione non ammesso per lo stato corrente dell'atto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [SUPPORTO]
      x-effetti: Modifica lo stato locale. Nessun effetto su ANSC.
      x-codici-errore:
        - codice: AZIONE_NON_AMMESSA
          condizione: 'Il tipo di azione non è previsto per lo stato corrente dell''atto.'

  /ansc/v1/back-office/atti/{idAtto}/riconciliazioni:
    parameters:
      - $ref: '#/components/parameters/IdAtto'
    post:
      operationId: riconciliaAtto
      summary: Accerta in ANSC lo stato reale dell'atto e allinea quello locale
      description: |
        Interroga ANSC per accertare lo stato reale dell'atto e allinea di conseguenza lo store
        locale, registrando l'esito come una riconciliazione consultabile.

        Si usa dopo un **esito indeterminato** — un timeout su deposito o firma, dove non si sa se
        l'operazione sia andata a buon fine — e ogni volta che lo stato locale è sospetto.

        **È l'alternativa al ritentativo, non un suo complemento.** Poiché ANSC non espone alcuna
        chiave di deduplica, ripetere un'operazione dall'esito ignoto rischia di creare un duplicato:
        prima si accerta, poi si decide.

        **Effetti**: modifica lo stato locale se diverge da quello reale; non modifica nulla in ANSC.
        Ripetibile senza effetti ulteriori.

        La può seguire `annullaAtto`, se la riconciliazione ha rivelato un duplicato.
      tags: [atti]
      responses:
        '200':
          description: Esito della riconciliazione, con l'indicazione se lo stato locale sia stato modificato.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/Riconciliazione' }
              examples:
                esempioDivergenza:
                  summary: Lo stato locale era disallineato
                  value:
                    esito: OK
                    messaggi:
                      - tipo: INFO
                        codice: RICONCILIAZIONE_DIVERGENZA
                        descrizione: Lo stato locale è stato allineato a quello reale in ANSC
                    dati:
                      idRiconciliazione: 4471
                      statoPrecedente: IN_PREPARAZIONE
                      statoReale: CONFERMATO
                      idAnsc: '2026-058091-000123'
                      flagAllineato: true
                      dataRiconciliazione: '2026-07-23T11:05:00+02:00'
        '409': { $ref: '#/components/responses/SessioneNonValida' }
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '502': { $ref: '#/components/responses/AnscNonRaggiungibile' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [SUPPORTO, USC]
      x-effetti: |
        Modifica lo stato locale se divergente. Nessun effetto su ANSC. Ripetibile.
      x-codici-errore:
        - codice: RICONCILIAZIONE_DIVERGENZA
          condizione: 'Lo stato reale differiva da quello locale ed è stato allineato.'
        - codice: RICONCILIAZIONE_DUPLICATO
          condizione: 'In ANSC risultano più eventi riconducibili allo stesso atto SIPO.'
    get:
      operationId: elencaRiconciliazioni
      summary: Elenca le riconciliazioni eseguite sull'atto
      description: |
        Restituisce lo storico delle riconciliazioni eseguite sull'atto, con lo stato accertato di
        volta in volta.

        Si usa per ricostruire la diagnosi di un'anomalia e per documentare le decisioni prese.

        **Effetti**: nessuno.
      tags: [atti]
      parameters:
        - $ref: '#/components/parameters/NumPagina'
        - $ref: '#/components/parameters/NumElementi'
      responses:
        '200':
          description: Storico delle riconciliazioni.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati:
                        type: object
                        properties:
                          riconciliazioni:
                            type: array
                            items: { $ref: '#/components/schemas/Riconciliazione' }
                            description: Le riconciliazioni, dalla più recente.
                          navigazione: { $ref: '#/components/schemas/Navigazione' }
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [SUPPORTO, AUDITOR]
      x-effetti: Sola lettura, sicura e ripetibile.

  # ------------------------------------------------------------- configurazione
  /ansc/v1/back-office/configurazione/operazioni:
    get:
      operationId: elencaOperazioni
      summary: Elenca le operazioni configurate
      description: |
        Restituisce le operazioni configurate — la terna evento, operazione e casistica con l'evento
        ANSC corrispondente — filtrabili per versione di configurazione.

        Si usa dalla schermata di amministrazione della configurazione.

        **Effetti**: nessuno.
      tags: [operazioni]
      parameters:
        - { name: codVersione, in: query, required: false, description: 'Versione di configurazione; se omessa vale quella attiva.', schema: { type: string } }
        - { name: codTipoEvento, in: query, required: false, description: 'Tipo di evento di stato civile.', schema: { type: string } }
        - $ref: '#/components/parameters/NumPagina'
        - $ref: '#/components/parameters/NumElementi'
      responses:
        '200':
          description: Elenco delle operazioni configurate.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati:
                        type: object
                        properties:
                          operazioni:
                            type: array
                            items: { $ref: '#/components/schemas/OperazioneConfigurata' }
                            description: Le operazioni della pagina richiesta.
                          navigazione: { $ref: '#/components/schemas/Navigazione' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Sola lettura, sicura e ripetibile.

  /ansc/v1/back-office/configurazione/operazioni/{idOperazione}:
    parameters:
      - $ref: '#/components/parameters/IdOperazione'
    get:
      operationId: leggiOperazione
      summary: Legge un'operazione configurata
      description: |
        Restituisce la configurazione di una singola operazione: evento ANSC, mappatore, indicatori di
        firma e trascrizione, versione e validità.

        **Effetti**: nessuno.
      tags: [operazioni]
      responses:
        '200':
          description: L'operazione configurata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/OperazioneConfigurata' }
              examples:
                esempioOperazioneMorte:
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      idOperazione: 1
                      codTipoEvento: MORTE
                      codTipoOperazione: CREAZIONE
                      codCasistica: DICH_ABITAZIONE
                      codEventoAnsc: Morte_001
                      codServizioAnsc: R009
                      idMapper: MorteDichiarazione
                      flagTrascrizione: false
                      flagFirma: true
                      codVersione: v.12
                      dataValiditaDa: '2026-07-20'
                      dataValiditaA: '9999-12-31'
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Sola lettura, sicura e ripetibile.
    put:
      operationId: sostituisciOperazione
      summary: Sostituisce la configurazione di un'operazione
      description: |
        Sostituisce integralmente la configurazione dell'operazione indicata.

        Si usa in fase di manutenzione della configurazione, su una versione **in stato di bozza**.

        **Effetti**: modifica la configurazione. **La versione attiva non è modificabile**: per
        cambiare una configurazione in esercizio si crea una nuova versione con `creaVersione`, la si
        modifica e la si rende corrente con `attivaVersione`. Ripetibile.
      tags: [operazioni]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperazioneConfigurata' }
      responses:
        '200':
          description: Configurazione sostituita.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/OperazioneConfigurata' }
        '409':
          description: La versione di configurazione è attiva e non modificabile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
              examples:
                esempioVersioneAttiva:
                  value:
                    esito: KO
                    messaggi:
                      - tipo: ERROR
                        codice: CONFIG_VERSIONE_ATTIVA
                        descrizione: La versione v.12 è attiva. Creare una nuova versione per modificarla.
                    dati: null
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Modifica la configurazione. Ripetibile.
      x-codici-errore:
        - codice: CONFIG_VERSIONE_ATTIVA
          condizione: 'Tentativo di modificare la versione di configurazione in esercizio.'

  /ansc/v1/back-office/configurazione/operazioni/{idOperazione}/campi:
    parameters:
      - $ref: '#/components/parameters/IdOperazione'
    get:
      operationId: elencaCampi
      summary: Elenca i campi configurati per un'operazione
      description: |
        Restituisce la mappatura campo per campo fra il modello ANSC e le colonne SIPO, con
        obbligatorietà, condizioni, dizionario di validazione e messaggio da mostrare all'operatore.

        È la configurazione che il pre-filtro applica in `verificaAtto`.

        **Effetti**: nessuno.
      tags: [operazioni]
      responses:
        '200':
          description: I campi configurati.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati:
                        type: object
                        properties:
                          campi:
                            type: array
                            items: { $ref: '#/components/schemas/CampoConfigurato' }
                            description: I campi dell'operazione.
              examples:
                esempioCampi:
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      campi:
                        - campoAnsc: evento.datiDiMorte.idComuneMorte
                          campoSipo: ATTO_DECESSO.ID_COMUNE_DECESSO
                          flagObbligatorio: false
                          condizione: se decesso in Italia
                          codDecodificaAnsc: null
                          messaggio: Comune del decesso
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Sola lettura, sicura e ripetibile.
    put:
      operationId: sostituisciCampi
      summary: Sostituisce i campi configurati per un'operazione
      description: |
        Sostituisce integralmente l'elenco dei campi configurati per l'operazione.

        Si usa dopo una revisione della mappatura. Vale il medesimo vincolo di
        `sostituisciOperazione`: la versione attiva non è modificabile.

        **Effetti**: modifica la configurazione. Ripetibile.
      tags: [operazioni]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campi:
                  type: array
                  items: { $ref: '#/components/schemas/CampoConfigurato' }
                  description: L'elenco completo dei campi che sostituisce quello esistente.
      responses:
        '200':
          description: Campi sostituiti.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
        '409':
          description: La versione di configurazione è attiva e non modificabile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Modifica la configurazione. Ripetibile.

  /ansc/v1/back-office/configurazione/operazioni/{idOperazione}/campi/importazioni:
    parameters:
      - $ref: '#/components/parameters/IdOperazione'
    post:
      operationId: importaCampi
      summary: Importa i campi dal mapping ufficiale dei casi d'uso ANSC
      description: |
        Popola i campi configurati a partire dal mapping ufficiale dei casi d'uso pubblicato da ANSC e
        dai dizionari replicati in locale, riducendo il lavoro manuale di prima configurazione.

        Si usa quando si abilita un nuovo evento o quando il fornitore pubblica una revisione del
        mapping.

        **Effetti**: crea o aggiorna i campi dell'operazione. Ripetibile: una seconda importazione
        dello stesso mapping non produce duplicati.

        **Che cosa non fa**: non decide le corrispondenze con le colonne SIPO, che restano da
        indicare a mano. L'importazione porta il lato ANSC — percorso del campo, obbligatorietà,
        condizione, dizionario — e lascia vuoto il lato SIPO.
      tags: [operazioni]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportazioneRichiesta' }
            examples:
              esempioImportazioneMorte:
                value:
                  codEventoAnsc: Morte_001
                  flagSovrascriviEsistenti: false
      responses:
        '200':
          description: Esito dell'importazione, con i conteggi.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/EsitoImportazione' }
              examples:
                esempioImportata:
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      numEsaminati: 219
                      numImportati: 38
                      numInvariati: 181
                      numDaCompletare: 38
        '404': { $ref: '#/components/responses/NonTrovato' }
        '409': { $ref: '#/components/responses/VersioneAttiva' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Modifica la configurazione. Ripetibile senza duplicati.

  /ansc/v1/back-office/configurazione/versioni:
    post:
      operationId: creaVersione
      summary: Crea una nuova versione di configurazione in stato di bozza
      description: |
        Crea una nuova versione di configurazione, clonando quella indicata come punto di partenza. La
        versione nasce **in stato di bozza** ed è l'unica forma in cui la configurazione sia
        modificabile.

        Si usa prima di ogni intervento sulla configurazione in esercizio.

        **Effetti**: crea una versione. Non modifica la configurazione attiva, che resta in vigore
        finché non si esegue `attivaVersione`.
      tags: [versioni]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersioneRichiesta' }
            examples:
              esempioNuovaVersione:
                value:
                  codVersione: v.13
                  codVersioneOrigine: v.12
                  note: Aggiunta casistica trascrizione da estero
      responses:
        '201':
          description: Versione creata in stato di bozza.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/Versione' }
        '409':
          description: Esiste già una versione con lo stesso codice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Crea una risorsa. Non ripetibile con lo stesso codice di versione.
      x-codici-errore:
        - codice: CONFIG_VERSIONE_DUPLICATA
          condizione: 'Il codice di versione richiesto esiste già.'

  /ansc/v1/back-office/configurazione/versioni/{codVersione}/attivazione:
    parameters:
      - $ref: '#/components/parameters/CodVersione'
    post:
      operationId: attivaVersione
      summary: Rende corrente una versione di configurazione
      description: |
        Rende corrente la versione indicata: da quel momento il pre-filtro e la mappatura usano la sua
        configurazione, e la versione diventa immodificabile.

        Si usa a valle della revisione di una bozza, tipicamente dopo averne valutato l'effetto in
        ambiente di test.

        **Effetti**: cambia la versione attiva. La versione prima attiva torna modificabile solo
        creandone una nuova a partire da essa. **L'attivazione non ha effetto sugli atti già
        depositati**, che conservano la versione con cui sono stati costruiti.

        Ripetibile: attivare una versione già attiva non produce effetti ulteriori.
      tags: [versioni]
      responses:
        '200':
          description: Versione resa corrente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/Versione' }
              examples:
                esempioAttivata:
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      codVersione: v.13
                      codStato: ATTIVA
                      dataAttivazione: '2026-07-25T09:00:00+02:00'
                      codVersionePrecedente: v.12
        '404': { $ref: '#/components/responses/NonTrovato' }
        '409':
          description: La versione contiene operazioni incomplete e non può essere attivata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Cambia la versione attiva. Ripetibile.
      x-codici-errore:
        - codice: CONFIG_VERSIONE_INCOMPLETA
          condizione: 'Una o più operazioni della versione hanno campi senza corrispondenza SIPO.'

  # --------------------------------------------------------------------- audit
  /ansc/v1/back-office/registrazioni-audit:
    get:
      operationId: elencaRegistrazioniAudit
      summary: Elenca le registrazioni delle chiamate verso ANSC
      description: |
        Restituisce le registrazioni delle chiamate verso ANSC, filtrabili per data, atto, esito e
        fase.

        Si usa per la diagnosi e per rispondere alle richieste del canale di supporto del fornitore,
        che richiede intestazioni, indirizzo pubblico di uscita e corpo della chiamata.

        **Effetti**: nessuno.

        **Le registrazioni contengono dati di stato civile**, quindi dati personali e in parte
        particolari: l'accesso è limitato ai ruoli Auditor e Supporto e ogni consultazione è a sua
        volta tracciata.
      tags: [registrazioni-audit]
      parameters:
        - { name: idAtto, in: query, required: false, description: 'Atto SIPO cui le chiamate si riferiscono.', schema: { type: integer } }
        - { name: codFase, in: query, required: false, description: 'Fase del percorso: ALLEGATI, SOGGETTO, DEPOSITO, FIRMA_DICH, FIRMA_USC, RICONCILIAZIONE.', schema: { type: string } }
        - { name: esito, in: query, required: false, description: 'Esito della chiamata: OK o KO.', schema: { type: string, enum: [OK, KO] } }
        - { name: dataDa, in: query, required: false, description: 'Limite inferiore dell''intervallo.', schema: { type: string, format: date } }
        - { name: dataA, in: query, required: false, description: 'Limite superiore dell''intervallo.', schema: { type: string, format: date } }
        - $ref: '#/components/parameters/NumPagina'
        - $ref: '#/components/parameters/NumElementi'
        - $ref: '#/components/parameters/Ordinamento'
      responses:
        '200':
          description: Elenco paginato delle registrazioni, senza i corpi integrali.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati:
                        type: object
                        properties:
                          registrazioni:
                            type: array
                            items: { $ref: '#/components/schemas/RegistrazioneAuditSintesi' }
                            description: Le registrazioni della pagina richiesta.
                          navigazione: { $ref: '#/components/schemas/Navigazione' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AUDITOR, SUPPORTO]
      x-effetti: Sola lettura, sicura e ripetibile.

  /ansc/v1/back-office/registrazioni-audit/{idRegistrazione}:
    parameters:
      - $ref: '#/components/parameters/IdRegistrazione'
    get:
      operationId: leggiRegistrazioneAudit
      summary: Legge una registrazione con richiesta e risposta integrali
      description: |
        Restituisce la singola registrazione con il corpo integrale della richiesta e della risposta
        scambiate con ANSC.

        Si usa quando la sintesi non basta a capire un rifiuto.

        **Effetti**: nessuno. La consultazione è a sua volta registrata.
      tags: [registrazioni-audit]
      responses:
        '200':
          description: La registrazione con i corpi integrali.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/RegistrazioneAudit' }
              examples:
                esempioRifiuto:
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      idRegistrazione: 900321
                      idStatoAtto: 550044
                      codFase: DEPOSITO
                      codServizio: R009
                      esitoChiamata: KO
                      numMillisecondi: 320
                      dataRegistrazione: '2026-07-23T10:07:03+02:00'
                      richiesta:
                        evento:
                          idUsecase: Morte_001
                          datiDiMorte: { dataMorte: '2026-07-20' }
                          intestatari: [ { idstatocivile: null } ]
                      risposta:
                        esito: KO
                        errors: [ 'stato civile del defunto assente' ]
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AUDITOR, SUPPORTO]
      x-effetti: Sola lettura, sicura e ripetibile.
      x-vincoli: |
        I corpi integrali sono soggetti alla politica di conservazione definita per lo schema di
        audit: oltre il termine stabilito la registrazione conserva i soli metadati.

  # -------------------------------------------------------------------- sistema
  /ansc/v1/back-office/sistema/stato:
    get:
      operationId: leggiStatoSistema
      summary: Legge lo stato del componente e la connettività verso ANSC
      description: |
        Restituisce l'ambiente in cui il componente è in esecuzione, l'indirizzo ANSC configurato, la
        versione di configurazione attiva e le metriche di dominio.

        Si usa dalla schermata di esercizio e come base per gli indicatori di monitoraggio.

        **Effetti**: nessuno. Non contatta ANSC: per verificare la raggiungibilità si usa
        `provaConnessione`.
      tags: [sistema]
      responses:
        '200':
          description: Stato del componente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/StatoSistema' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Sola lettura, sicura e ripetibile.

  /ansc/v1/back-office/sistema/prove-connessione:
    post:
      operationId: provaConnessione
      summary: Verifica la raggiungibilità di ANSC
      description: |
        Esegue una chiamata di prova verso ANSC e ne registra l'esito, con il tempo di risposta.

        Si usa in diagnosi, quando si sospetta un problema di rete o di certificati, e dopo ogni
        modifica alla configurazione degli indirizzi.

        **Effetti**: crea una registrazione di prova. Non modifica alcun atto.

        **Prerequisiti**: se la verifica riguarda un servizio che richiede l'OTP, occorre una
        sessione valida. La prova sul solo canale di rete non la richiede.
      tags: [sistema]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvaConnessioneRichiesta' }
            examples:
              esempioProvaRete:
                value:
                  codTipoProva: RETE
      responses:
        '200':
          description: Esito della prova.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/EsitoProvaConnessione' }
              examples:
                esempioProvaRiuscita:
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      codTipoProva: RETE
                      flagRaggiungibile: true
                      numMillisecondi: 148
                      indirizzoAnsc: https://anscservicepre.anpr.interno.it
                      dataProva: '2026-07-23T08:15:00+02:00'
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '502': { $ref: '#/components/responses/AnscNonRaggiungibile' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Crea una registrazione di prova. Ripetibile.

  /ansc/v1/back-office/sessioni:
    get:
      operationId: elencaSessioni
      summary: Elenca le sessioni OTP aperte
      description: |
        Restituisce le sessioni OTP attualmente aperte, con operatore, postazione e scadenza.

        Si usa per la supervisione dell'esercizio: capire quanti ufficiali stiano lavorando e
        individuare sessioni prossime alla scadenza.

        **Effetti**: nessuno. **Il codice OTP non è mai restituito**, in nessuna forma.
      tags: [sessione]
      parameters:
        - { name: idMunicipio, in: query, required: false, description: 'Municipio della postazione.', schema: { type: string } }
        - $ref: '#/components/parameters/NumPagina'
        - $ref: '#/components/parameters/NumElementi'
      responses:
        '200':
          description: Elenco delle sessioni aperte.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati:
                        type: object
                        properties:
                          sessioni:
                            type: array
                            items: { $ref: '#/components/schemas/Sessione' }
                            description: Le sessioni aperte.
                          navigazione: { $ref: '#/components/schemas/Navigazione' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Sola lettura, sicura e ripetibile.

  # ----------------------------------------------------------------- postazioni
  /ansc/v1/back-office/postazioni:
    get:
      operationId: elencaPostazioni
      summary: Elenca le postazioni autorizzate
      description: |
        Restituisce il registro delle postazioni autorizzate, con l'associazione fra postazione fisica
        e identificativo attribuito.

        Il registro è un **obbligo normativo** nel modello a certificato server unico: è ciò che
        consente di ricondurre ogni operazione alla postazione da cui è stata compiuta.

        **Effetti**: nessuno.
      tags: [postazioni]
      parameters:
        - { name: idMunicipio, in: query, required: false, description: 'Municipio di appartenenza.', schema: { type: string } }
        - { name: flagAttiva, in: query, required: false, description: 'Limita alle postazioni attive o a quelle dismesse.', schema: { type: boolean } }
        - $ref: '#/components/parameters/NumPagina'
        - $ref: '#/components/parameters/NumElementi'
      responses:
        '200':
          description: Il registro delle postazioni.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati:
                        type: object
                        properties:
                          postazioni:
                            type: array
                            items: { $ref: '#/components/schemas/Postazione' }
                            description: Le postazioni della pagina richiesta.
                          navigazione: { $ref: '#/components/schemas/Navigazione' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE, AUDITOR]
      x-effetti: Sola lettura, sicura e ripetibile.
    post:
      operationId: creaPostazione
      summary: Registra una nuova postazione autorizzata
      description: |
        Aggiunge una postazione al registro, associandole l'identificativo con cui comparirà nei token
        verso ANSC.

        Si usa all'attivazione di una nuova postazione di lavoro.

        **Effetti**: crea una risorsa e registra una voce di audit. Non ripetibile con lo stesso
        identificativo.
      tags: [postazioni]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Postazione' }
            examples:
              esempioNuovaPostazione:
                value:
                  idPostazione: PDL-SC-027
                  descPostazione: Sportello 3 — Municipio I
                  idMunicipio: '01'
                  idPostazioneAnpr: RM-0127
                  flagAttiva: true
      responses:
        '201':
          description: Postazione registrata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/Postazione' }
        '409':
          description: Esiste già una postazione con lo stesso identificativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Crea una risorsa. Non ripetibile con lo stesso identificativo.
      x-codici-errore:
        - codice: POSTAZIONE_DUPLICATA
          condizione: 'L''identificativo di postazione è già presente nel registro.'

  /ansc/v1/back-office/postazioni/{idPostazione}:
    parameters:
      - $ref: '#/components/parameters/IdPostazione'
    put:
      operationId: sostituisciPostazione
      summary: Sostituisce i dati di una postazione del registro
      description: |
        Sostituisce integralmente i dati della postazione indicata: descrizione, municipio,
        identificativo attribuito, stato di attività.

        Si usa per dismettere una postazione o correggerne i dati.

        **Effetti**: modifica il registro e registra una voce di audit. Dismettere una postazione
        **non chiude** le sessioni OTP già aperte su di essa: per quelle si usa la chiusura di
        sessione. Ripetibile.
      tags: [postazioni]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Postazione' }
      responses:
        '200':
          description: Postazione aggiornata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/Postazione' }
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [AMMINISTRATORE]
      x-effetti: Modifica il registro. Ripetibile.

components:

  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token di sessione **interno a SIPO**, emesso dal meccanismo di autenticazione già in uso fra i
        moduli. Non è il token verso ANSC: quello è costruito e firmato dal concentratore con il
        certificato server e non transita mai per il front-end.

  parameters:
    IdAtto:
      name: idAtto
      in: path
      required: true
      description: Identificativo dell'atto in SIPO.
      schema: { type: integer, format: int64 }
      example: 88012
    IdAllegato:
      name: idAllegato
      in: path
      required: true
      description: Identificativo locale dell'allegato, assegnato alla trasmissione.
      schema: { type: integer, format: int64 }
      example: 771204
    IdOperazione:
      name: idOperazione
      in: path
      required: true
      description: Identificativo dell'operazione configurata.
      schema: { type: integer, format: int64 }
      example: 1
    CodVersione:
      name: codVersione
      in: path
      required: true
      description: Codice della versione di configurazione.
      schema: { type: string }
      example: v.13
    IdRegistrazione:
      name: idRegistrazione
      in: path
      required: true
      description: Identificativo della registrazione di audit.
      schema: { type: integer, format: int64 }
      example: 900321
    IdPostazione:
      name: idPostazione
      in: path
      required: true
      description: Identificativo della postazione nel registro.
      schema: { type: string }
      example: PDL-SC-014
    NumPagina:
      name: numPagina
      in: query
      required: false
      description: Numero della pagina richiesta, a partire da 1.
      schema: { type: integer, minimum: 1, default: 1 }
    NumElementi:
      name: numElementi
      in: query
      required: false
      description: Numero massimo di elementi per pagina.
      schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
    Ordinamento:
      name: ordinamento
      in: query
      required: false
      description: |
        Campi di ordinamento separati da virgola; il segno meno indica il verso discendente.
      schema: { type: string }
      example: -dataDeposito,idAtto
    Campi:
      name: campi
      in: query
      required: false
      description: Sottoinsieme dei campi da restituire, separati da virgola.
      schema: { type: string }
      example: idAttoSipo,stato,idAnsc

  responses:
    NonAutenticato:
      description: Chiamante non autenticato o token scaduto.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Busta' }
    NonAutorizzato:
      description: Il ruolo del chiamante non consente l'operazione.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Busta' }
    NonTrovato:
      description: La risorsa indicata nel percorso non esiste.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Busta' }
    ErroreInterno:
      description: Errore non previsto del componente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Busta' }
    SessioneNonValida:
      description: |
        Nessuna sessione OTP valida per la coppia operatore-postazione. L'operatore deve generare un
        nuovo codice sulla web app OTP di ANSC e consegnarlo con `sostituisciSessione`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Busta' }
          examples:
            esempioSessioneScaduta:
              value:
                esito: KO
                messaggi:
                  - tipo: ERROR
                    codice: SESSIONE_OTP_ASSENTE
                    descrizione: Sessione OTP assente o scaduta. Generare un nuovo codice e riprovare.
                dati: null
    VersioneAttiva:
      description: La versione di configurazione è attiva e non modificabile.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Busta' }
    AnscNonRaggiungibile:
      description: |
        ANSC non ha risposto o ha risposto con un errore di trasporto. **L'operazione non è stata
        eseguita**: nulla è cambiato sul sistema nazionale.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Busta' }
    EsitoIndeterminato:
      description: |
        La chiamata verso ANSC è scaduta senza risposta: **non è noto se l'operazione sia stata
        eseguita**. Non ripetere l'operazione: accertare lo stato reale con `riconciliaAtto` e
        decidere di conseguenza.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Busta' }
          examples:
            esempioTimeout:
              value:
                esito: KO
                messaggi:
                  - tipo: ERROR
                    codice: ESITO_INDETERMINATO
                    descrizione: Timeout verso ANSC. Eseguire la riconciliazione per accertare lo stato.
                dati: { codTipoEsito: INDETERMINATO }

  schemas:

    Busta:
      type: object
      description: |
        Busta applicativa comune a tutte le risposte. La scelta della busta al posto del formato
        normalizzato per gli errori è dichiarata e vale per l'intero componente.
      required: [esito]
      properties:
        esito:
          type: string
          enum: [OK, KO]
          description: |
            Esito applicativo dell'operazione. È indipendente dal codice di stato HTTP: una
            validazione respinta è un `200` con esito `KO`, perché l'operazione è stata eseguita
            correttamente e ha prodotto un rifiuto.
        messaggi:
          type: array
          description: Messaggi diagnostici, di errore o informativi, prodotti dall'operazione.
          items: { $ref: '#/components/schemas/Messaggio' }
        dati:
          nullable: true
          description: Il contenuto proprio della risposta, la cui forma dipende dall'operazione.

    Messaggio:
      type: object
      description: Singolo messaggio della busta.
      required: [tipo, codice, descrizione]
      properties:
        tipo:
          type: string
          enum: [ERROR, WARNING, INFO]
          description: Gravità del messaggio. Solo `ERROR` impedisce la prosecuzione.
        campo:
          type: string
          nullable: true
          description: |
            Percorso del campo cui il messaggio si riferisce, nella stessa notazione con cui il campo
            compare nell'entità. Omesso quando il messaggio non riguarda un campo specifico.
        codice:
          type: string
          description: |
            Codice applicativo stabile, in maiuscolo, nella forma «ambito_condizione». È la parte su
            cui il consumatore scrive logica: la descrizione può cambiare senza preavviso.
        descrizione:
          type: string
          description: Testo destinato alle persone, mostrabile all'operatore.

    Navigazione:
      type: object
      description: Dati di navigazione di una collezione paginata.
      properties:
        numPagina: { type: integer, description: 'Pagina restituita.' }
        numElementi: { type: integer, description: 'Elementi per pagina.' }
        numTotale: { type: integer, description: 'Elementi totali che soddisfano il filtro.' }

    StatoAnsc:
      type: string
      description: |
        Stato dell'atto nel ciclo di vita reale di ANSC, con l'aggiunta dello stato locale
        `IN_PREPARAZIONE`, che vale finché in ANSC non è stato creato nulla.
      enum: [IN_PREPARAZIONE, CONFERMATO, FIRMATO_DICHIARANTE, FIRMATO_USC, RIFIUTATA, ANNULLATO]

    Sessione:
      type: object
      description: Stato di una sessione OTP. Il codice OTP non è mai esposto.
      properties:
        flagValida: { type: boolean, description: 'Indica se la sessione sia utilizzabile per chiamare ANSC.' }
        idPostazione: { type: string, description: 'Postazione cui la sessione è legata.' }
        operatore: { type: string, description: 'Identificativo dell''ufficiale titolare della sessione.' }
        dataScadenza:
          type: string
          format: date-time
          nullable: true
          description: Istante di scadenza della sessione, con fuso esplicito. Nullo se non esiste sessione.
        numMinutiResidui: { type: integer, description: 'Minuti mancanti alla scadenza; zero se la sessione non è valida.' }

    SessioneRichiesta:
      type: object
      required: [codOtp, idPostazione]
      properties:
        codOtp:
          type: string
          description: |
            Codice generato dall'operatore sulla web app OTP di ANSC. Ha validità di quattro ore. Non
            è persistito oltre la durata della sessione e non compare in alcuna registrazione.
        idPostazione:
          type: string
          description: Postazione da cui l'operatore sta lavorando; deve essere nel registro.

    PreverificaRichiesta:
      type: object
      required: [idAttoSipo, codTipoEvento, codTipoOperazione, codCasistica]
      properties:
        idAttoSipo: { type: integer, format: int64, description: 'Identificativo dell''atto in SIPO, da cui si rileggono i dati.' }
        codTipoEvento: { type: string, description: 'Tipo di evento di stato civile, per esempio MORTE.' }
        codTipoOperazione: { type: string, description: 'Operazione richiesta, per esempio CREAZIONE.' }
        codCasistica: { type: string, description: 'Casistica che distingue le varianti dell''evento, per esempio DICH_ABITAZIONE.' }
        codVersioneConfig:
          type: string
          nullable: true
          description: Versione di configurazione da applicare. Se omesso vale quella attiva.

    EsitoPreverifica:
      type: object
      properties:
        flagFinalizzabile: { type: boolean, description: 'Indica se l''atto possa procedere al deposito.' }
        codEventoAnsc: { type: string, description: 'Evento ANSC individuato dalla configurazione.' }
        numCampiVerificati: { type: integer, description: 'Numero di campi sottoposti a controllo.' }
        codVersioneConfig: { type: string, description: 'Versione di configurazione effettivamente applicata.' }

    AllegatoRichiesta:
      type: object
      required: [codTipoAllegato, nomeFile, codTipoContenuto, contenutoBase64]
      properties:
        codTipoAllegato: { type: string, description: 'Tipo di allegato previsto dal caso d''uso ANSC.' }
        nomeFile: { type: string, description: 'Nome del file, usato nella diagnosi e nelle registrazioni.' }
        codTipoContenuto: { type: string, description: 'Tipo di contenuto del documento.' }
        contenutoBase64: { type: string, format: byte, description: 'Contenuto del documento codificato in base64.' }

    Allegato:
      type: object
      properties:
        idAllegato: { type: integer, format: int64, description: 'Identificativo locale dell''allegato.' }
        idAllegatoAnsc: { type: string, nullable: true, description: 'Identificativo attribuito da ANSC.' }
        codTipoAllegato: { type: string, description: 'Tipo di allegato.' }
        nomeFile: { type: string, description: 'Nome del file trasmesso.' }
        codStatoVerifica:
          type: string
          enum: [IN_CORSO, SUPERATA, RESPINTA]
          description: Esito della scansione antivirus eseguita da ANSC.
        dataTrasmissione: { type: string, format: date-time, description: 'Istante della trasmissione, con fuso esplicito.' }

    DepositoRichiesta:
      type: object
      required: [idAttoSipo, codTipoEvento, codTipoOperazione, codCasistica, operatore, idPostazione]
      properties:
        idAttoSipo: { type: integer, format: int64, description: 'Atto SIPO da depositare; i dati sono riletti alla chiamata.' }
        codTipoEvento: { type: string, description: 'Tipo di evento di stato civile.' }
        codTipoOperazione: { type: string, description: 'Operazione richiesta.' }
        codCasistica: { type: string, description: 'Casistica dell''evento.' }
        codVersioneConfig: { type: string, nullable: true, description: 'Versione di configurazione; se omesso vale quella attiva.' }
        idOperazioneComune:
          type: string
          description: |
            Identificativo scelto dal Comune, trasmesso ad ANSC a fini di tracciamento. **Non è una
            chiave di deduplica**: ANSC non ne offre alcuna, e trasmettere due volte lo stesso valore
            non impedisce la creazione di due atti.
        operatore: { type: string, description: 'Ufficiale che sta formando l''atto.' }
        idPostazione: { type: string, description: 'Postazione da cui l''operazione è compiuta.' }

    EsitoDeposito:
      type: object
      properties:
        idStatoAtto: { type: integer, format: int64, description: 'Identificativo della riga di stato locale.' }
        stato: { $ref: '#/components/schemas/StatoAnsc' }
        idAnsc:
          type: string
          nullable: true
          description: |
            Identificativo nazionale assegnato da ANSC. Valorizzato solo a deposito riuscito; nullo
            quando la validazione è respinta, perché in quel caso nessun identificativo è consumato.
        codEventoAnsc: { type: string, description: 'Evento ANSC con cui l''atto è stato depositato.' }
        codTipoEsito:
          type: string
          nullable: true
          enum: [DEPOSITATO, SCARTATO, INDETERMINATO]
          description: |
            Distingue lo scarto in validazione dall'esito indeterminato. Sono situazioni opposte:
            dallo scarto si esce correggendo i dati, dall'indeterminato accertando lo stato reale.
        dataDeposito: { type: string, format: date-time, nullable: true, description: 'Istante del deposito, con fuso esplicito.' }

    CredenzialiFirma:
      type: object
      description: |
        Credenziali del provider di firma qualificata, valide per il singolo atto. **Sono cosa diversa
        dall'OTP di sessione.** Non sono persistite né registrate in audit.
      required: [utenza, pin, codOtpProvider]
      properties:
        utenza: { type: string, description: 'Utenza dell''ufficiale presso il provider di firma.' }
        pin: { type: string, format: password, description: 'PIN di firma.' }
        codOtpProvider: { type: string, description: 'Codice temporaneo emesso dal provider di firma per questa firma.' }

    FirmaRichiesta:
      type: object
      required: [codTipoFirma]
      properties:
        codTipoFirma:
          type: string
          enum: [DICHIARANTE, USC]
          description: Firma da apporre.
        idAllegatoVerbale:
          type: integer
          format: int64
          nullable: true
          description: |
            Allegato che contiene il verbale firmato dal dichiarante. Obbligatorio quando
            `codTipoFirma` vale `DICHIARANTE` e la firma è cartacea, come per l'atto di morte.
        credenzialiFirma:
          allOf: [ { $ref: '#/components/schemas/CredenzialiFirma' } ]
          nullable: true
          description: Obbligatorie quando `codTipoFirma` vale `USC`.

    EsitoFirma:
      type: object
      properties:
        idStatoAtto: { type: integer, format: int64, description: 'Identificativo della riga di stato locale.' }
        stato: { $ref: '#/components/schemas/StatoAnsc' }
        idAnsc: { type: string, description: 'Identificativo nazionale dell''atto.' }
        dataFirma: { type: string, format: date-time, nullable: true, description: 'Istante della firma, con fuso esplicito.' }

    Firma:
      type: object
      properties:
        codTipoFirma: { type: string, enum: [DICHIARANTE, USC], description: 'Tipo di firma apposta.' }
        firmatario: { type: string, description: 'Identificativo di chi ha firmato.' }
        dataFirma: { type: string, format: date-time, description: 'Istante della firma, con fuso esplicito.' }

    AnnullamentoRichiesta:
      type: object
      required: [idAnsc, codMotivo]
      properties:
        idAnsc: { type: string, description: 'Identificativo nazionale dell''evento da annullare logicamente.' }
        codMotivo:
          type: string
          description: Motivo dell'annullamento; il valore atteso nel pilota è `DUPLICATO_DA_RICONCILIAZIONE`.
        note: { type: string, nullable: true, description: 'Annotazione libera a corredo della decisione.' }

    EsitoAnnullamento:
      type: object
      properties:
        idAnsc: { type: string, description: 'Identificativo nazionale dell''evento annullato.' }
        stato: { $ref: '#/components/schemas/StatoAnsc' }
        dataAnnullamento: { type: string, format: date-time, description: 'Istante dell''annullamento, con fuso esplicito.' }

    StatoAtto:
      type: object
      description: Stato ANSC di un atto, come registrato nello store locale.
      properties:
        idAttoSipo: { type: integer, format: int64, description: 'Atto SIPO cui lo stato si riferisce.' }
        codTipoEvento: { type: string, description: 'Tipo di evento di stato civile.' }
        codTipoOperazione: { type: string, description: 'Operazione.' }
        stato: { $ref: '#/components/schemas/StatoAnsc' }
        idAnsc: { type: string, nullable: true, description: 'Identificativo nazionale, se assegnato.' }
        operatore: { type: string, nullable: true, description: 'Ufficiale competente.' }
        idMunicipio: { type: string, nullable: true, description: 'Municipio di competenza.' }
        dataAggiornamento: { type: string, format: date-time, description: 'Ultimo aggiornamento dello stato locale.' }

    VoceCronologia:
      type: object
      description: Una chiamata verso ANSC nella storia dell'atto.
      properties:
        codFase: { type: string, description: 'Fase del percorso: ALLEGATI, SOGGETTO, DEPOSITO, FIRMA_DICH, FIRMA_USC, RICONCILIAZIONE.' }
        codServizio: { type: string, description: 'Servizio cooperativo ANSC invocato.' }
        esito: { type: string, enum: [OK, KO], description: 'Esito della chiamata.' }
        dataChiamata: { type: string, format: date-time, description: 'Istante della chiamata, con fuso esplicito.' }

    DettaglioAtto:
      type: object
      properties:
        idAttoSipo: { type: integer, format: int64, description: 'Atto SIPO.' }
        codTipoEvento: { type: string, description: 'Tipo di evento.' }
        codTipoOperazione: { type: string, description: 'Operazione.' }
        soggetto: { type: string, description: 'Descrizione sintetica del soggetto intestatario.' }
        idAnsc: { type: string, nullable: true, description: 'Identificativo nazionale.' }
        statoAnsc: { $ref: '#/components/schemas/StatoAnsc' }
        statoLocale: { $ref: '#/components/schemas/StatoAnsc' }
        cronologia:
          type: array
          description: Le chiamate verso ANSC che riguardano l'atto, in ordine cronologico.
          items: { $ref: '#/components/schemas/VoceCronologia' }

    Eccezione:
      type: object
      description: Un atto non concluso nel percorso ordinario.
      properties:
        idAttoSipo: { type: integer, format: int64, description: 'Atto SIPO.' }
        codTipoEvento: { type: string, description: 'Tipo di evento.' }
        stato: { $ref: '#/components/schemas/StatoAnsc' }
        codCategoria:
          type: string
          description: |
            Categoria di eccezione, che determina l'azione di recupero proponibile: DA_RIPRENDERE,
            INDETERMINATI, SCARTATI, BLOCCATI_ALLEGATO, FIRMA_NON_RIUSCITA.
        descProblema: { type: string, description: 'Descrizione del problema, mostrabile in lista.' }
        operatore: { type: string, nullable: true, description: 'Ufficiale competente.' }
        idMunicipio: { type: string, nullable: true, description: 'Municipio di competenza.' }
        ultimoErrore: { type: string, nullable: true, description: 'Codice e testo dell''ultimo errore restituito da ANSC.' }
        dataUltimoTentativo: { type: string, format: date-time, nullable: true, description: 'Istante dell''ultimo tentativo, con fuso esplicito.' }

    AzioneRichiesta:
      type: object
      required: [codTipoAzione]
      properties:
        codTipoAzione:
          type: string
          enum: [INSTRADA, ANNOTA, PRENDI_IN_CARICO]
          description: Tipo di azione locale da registrare.
        operatoreDestinatario: { type: string, nullable: true, description: 'Ufficiale cui instradare l''atto; obbligatorio per `INSTRADA`.' }
        note: { type: string, nullable: true, description: 'Annotazione libera.' }

    Azione:
      type: object
      properties:
        idAzione: { type: integer, format: int64, description: 'Identificativo dell''azione registrata.' }
        codTipoAzione: { type: string, description: 'Tipo di azione.' }
        operatore: { type: string, description: 'Chi ha compiuto l''azione.' }
        dataAzione: { type: string, format: date-time, description: 'Istante dell''azione, con fuso esplicito.' }

    Riconciliazione:
      type: object
      properties:
        idRiconciliazione: { type: integer, format: int64, description: 'Identificativo della riconciliazione.' }
        statoPrecedente: { $ref: '#/components/schemas/StatoAnsc' }
        statoReale: { $ref: '#/components/schemas/StatoAnsc' }
        idAnsc: { type: string, nullable: true, description: 'Identificativo nazionale accertato.' }
        flagAllineato: { type: boolean, description: 'Indica se lo stato locale sia stato modificato per effetto della riconciliazione.' }
        dataRiconciliazione: { type: string, format: date-time, description: 'Istante della riconciliazione, con fuso esplicito.' }

    OperazioneConfigurata:
      type: object
      properties:
        idOperazione: { type: integer, format: int64, description: 'Identificativo dell''operazione configurata.' }
        codTipoEvento: { type: string, description: 'Tipo di evento di stato civile.' }
        codTipoOperazione: { type: string, description: 'Operazione.' }
        codCasistica: { type: string, description: 'Casistica che distingue le varianti dell''evento.' }
        codEventoAnsc: { type: string, description: 'Evento ANSC corrispondente alla terna.' }
        codServizioAnsc: { type: string, description: 'Servizio cooperativo con cui l''operazione è eseguita.' }
        idMapper: { type: string, description: 'Adattatore di mappatura che costruisce il payload.' }
        flagTrascrizione: { type: boolean, description: 'Indica se si tratti di trascrizione di atto formato altrove.' }
        flagFirma: { type: boolean, description: 'Indica se l''operazione richieda la firma.' }
        codVersione: { type: string, description: 'Versione di configurazione cui la riga appartiene.' }
        dataValiditaDa: { type: string, format: date, description: 'Inizio di validità.' }
        dataValiditaA: { type: string, format: date, description: 'Fine di validità.' }

    CampoConfigurato:
      type: object
      properties:
        campoAnsc: { type: string, description: 'Percorso del campo nel modello dell''evento ANSC.' }
        campoSipo: { type: string, nullable: true, description: 'Colonna SIPO che alimenta il campo, nella forma TABELLA.COLONNA. Nulla se ancora da definire.' }
        flagObbligatorio: { type: boolean, description: 'Indica se il campo sia obbligatorio per il caso d''uso.' }
        condizione: { type: string, nullable: true, description: 'Condizione alla quale l''obbligatorietà si applica.' }
        codDecodificaAnsc: { type: string, nullable: true, description: 'Dizionario ANSC con cui validare il valore; nullo se il campo non è codificato.' }
        messaggio: { type: string, description: 'Testo mostrato all''operatore quando il controllo non è superato.' }

    ImportazioneRichiesta:
      type: object
      required: [codEventoAnsc]
      properties:
        codEventoAnsc: { type: string, description: 'Evento ANSC di cui importare il mapping ufficiale.' }
        flagSovrascriviEsistenti: { type: boolean, default: false, description: 'Indica se sovrascrivere i campi già configurati o lasciarli invariati.' }

    EsitoImportazione:
      type: object
      properties:
        numEsaminati: { type: integer, description: 'Righe esaminate nel mapping di origine.' }
        numImportati: { type: integer, description: 'Campi creati o aggiornati.' }
        numInvariati: { type: integer, description: 'Campi lasciati invariati.' }
        numDaCompletare: { type: integer, description: 'Campi importati che restano senza corrispondenza SIPO.' }

    VersioneRichiesta:
      type: object
      required: [codVersione]
      properties:
        codVersione: { type: string, description: 'Codice della nuova versione.' }
        codVersioneOrigine: { type: string, nullable: true, description: 'Versione da clonare; se omessa si parte da quella attiva.' }
        note: { type: string, nullable: true, description: 'Motivo della nuova versione.' }

    Versione:
      type: object
      properties:
        codVersione: { type: string, description: 'Codice della versione.' }
        codStato: { type: string, enum: [BOZZA, ATTIVA, SUPERATA], description: 'Stato della versione.' }
        dataAttivazione: { type: string, format: date-time, nullable: true, description: 'Istante in cui è diventata corrente.' }
        codVersionePrecedente: { type: string, nullable: true, description: 'Versione che era attiva prima di questa.' }

    RegistrazioneAuditSintesi:
      type: object
      description: Registrazione di audit senza i corpi integrali.
      properties:
        idRegistrazione: { type: integer, format: int64, description: 'Identificativo della registrazione.' }
        idStatoAtto: { type: integer, format: int64, nullable: true, description: 'Riga di stato cui la chiamata si riferisce.' }
        codFase: { type: string, description: 'Fase del percorso.' }
        codServizio: { type: string, description: 'Servizio cooperativo invocato.' }
        esitoChiamata: { type: string, enum: [OK, KO], description: 'Esito della chiamata.' }
        numMillisecondi: { type: integer, description: 'Durata della chiamata.' }
        dataRegistrazione: { type: string, format: date-time, description: 'Istante della chiamata, con fuso esplicito.' }

    RegistrazioneAudit:
      allOf:
        - $ref: '#/components/schemas/RegistrazioneAuditSintesi'
        - type: object
          properties:
            richiesta:
              type: object
              description: |
                Corpo integrale della richiesta inviata ad ANSC. **Contiene dati di stato civile.**
                I campi ereditati dal contratto ANSC conservano la grafia originale, che non segue la
                notazione di questo documento.
              additionalProperties: true
            risposta:
              type: object
              description: Corpo integrale della risposta di ANSC, con la stessa avvertenza sulla grafia.
              additionalProperties: true

    StatoSistema:
      type: object
      properties:
        codAmbiente: { type: string, enum: [SVILUPPO, TEST, ESERCIZIO], description: 'Ambiente SIPO in cui il componente è in esecuzione.' }
        indirizzoAnsc: { type: string, description: 'Indirizzo ANSC configurato per l''ambiente.' }
        codVersioneConfigAttiva: { type: string, description: 'Versione di configurazione corrente.' }
        numAttiNonConclusi: { type: integer, description: 'Atti in stato non chiuso, per il monitoraggio.' }
        numEsitiIndeterminatiAperti: { type: integer, description: 'Esiti indeterminati non ancora riconciliati.' }
        numSessioniAperte: { type: integer, description: 'Sessioni OTP attualmente valide.' }

    ProvaConnessioneRichiesta:
      type: object
      properties:
        codTipoProva:
          type: string
          enum: [RETE, SERVIZIO]
          default: RETE
          description: |
            `RETE` verifica la sola raggiungibilità dell'indirizzo e non richiede sessione OTP;
            `SERVIZIO` esegue una chiamata cooperativa di prova e la richiede.

    EsitoProvaConnessione:
      type: object
      properties:
        codTipoProva: { type: string, description: 'Tipo di prova eseguita.' }
        flagRaggiungibile: { type: boolean, description: 'Esito della prova.' }
        numMillisecondi: { type: integer, description: 'Tempo di risposta misurato.' }
        indirizzoAnsc: { type: string, description: 'Indirizzo verificato.' }
        dataProva: { type: string, format: date-time, description: 'Istante della prova, con fuso esplicito.' }

    Postazione:
      type: object
      required: [idPostazione, descPostazione, idMunicipio]
      properties:
        idPostazione: { type: string, description: 'Identificativo della postazione fisica.' }
        descPostazione: { type: string, description: 'Descrizione leggibile della collocazione.' }
        idMunicipio: { type: string, description: 'Municipio di appartenenza.' }
        idPostazioneAnpr: { type: string, nullable: true, description: 'Identificativo attribuito alla postazione, usato nel token verso ANSC.' }
        flagAttiva: { type: boolean, description: 'Indica se la postazione sia in esercizio o dismessa.' }
