        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC, SUPPORTO, AUDITOR]
      x-effetti: Sola lettura, sicura e ripetibile.

  # ================================================================ BACK-OFFICE

  /ansc/v1/back-office/eccezioni:
    get:
      operationId: elencaEccezioni
      summary: Elenca gli atti non conclusi nel percorso ordinario
      description: |
        Restituisce la worklist delle eccezioni: gli atti che non si sono conclusi nel percorso
        presidiato e richiedono un intervento, raggruppati per categoria di anomalia.

        Si usa come schermata di ingresso della supervisione. **Non è la superficie di lavoro
        ordinaria**: la formazione degli atti avviene nelle maschere SIPO, non qui.

        Le categorie ricalcano la tassonomia degli errori per fase: da riprendere, indeterminati,
        scartati in validazione, bloccati su allegato, firma non riuscita.

        **Effetti**: nessuno. Legge lo store di stato locale.
      tags: [eccezioni]
      parameters:
        - { name: codCategoria, in: query, required: false, description: 'Categoria di eccezione: DA_RIPRENDERE, INDETERMINATI, SCARTATI, BLOCCATI_ALLEGATO, FIRMA_NON_RIUSCITA.', schema: { type: string } }
        - { name: idMunicipio, in: query, required: false, description: 'Municipio di competenza.', schema: { type: string } }
        - { name: operatore, in: query, required: false, description: 'Ufficiale cui l''atto è instradato.', schema: { type: string } }
        - { name: stato, in: query, required: false, description: 'Stato reale dell''atto in ANSC.', schema: { $ref: '#/components/schemas/StatoAnsc' } }
        - $ref: '#/components/parameters/NumPagina'
        - $ref: '#/components/parameters/NumElementi'
        - $ref: '#/components/parameters/Ordinamento'
      responses:
        '200':
          description: Elenco paginato delle eccezioni, con i contatori per categoria.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati:
                        type: object
                        properties:
                          eccezioni:
                            type: array
                            description: Le eccezioni della pagina richiesta.
                            items: { $ref: '#/components/schemas/Eccezione' }
                          contatori:
                            type: array
                            description: Numero di atti per categoria, sull'intero insieme filtrato.
                            items:
                              type: object
                              properties:
                                codCategoria: { type: string, description: 'Categoria di eccezione.' }
                                numAtti: { type: integer, description: 'Atti nella categoria.' }
                          navigazione: { $ref: '#/components/schemas/Navigazione' }
              examples:
                esempioWorklist:
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      eccezioni:
                        - idAttoSipo: 88431
                          codTipoEvento: MORTE
                          stato: CONFERMATO
                          codCategoria: DA_RIPRENDERE
                          descProblema: Sessione OTP scaduta durante la firma
                          operatore: VRDGPP75B02H501Z
                          idMunicipio: '01'
                          ultimoErrore: '406002 — token scaduto'
                          dataUltimoTentativo: '2026-07-23T09:41:00+02:00'
                      contatori:
                        - { codCategoria: DA_RIPRENDERE, numAtti: 4 }
                        - { codCategoria: INDETERMINATI, numAtti: 1 }
                      navigazione: { numPagina: 1, numElementi: 25, numTotale: 5 }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC, SUPPORTO]
      x-effetti: Sola lettura, sicura e ripetibile.

