  # ----------------------------------------------------------------------- firme
  /ansc/v1/atti/{idAtto}/firme:
    parameters:
      - $ref: '#/components/parameters/IdAtto'
    post:
      operationId: firmaAtto
      summary: Appone una firma sull'atto depositato
      description: |
        Appone sull'atto la firma del dichiarante o quella dell'Ufficiale di Stato Civile, portandolo
        allo stato successivo del ciclo di vita. Con la firma dell'Ufficiale **l'atto è formato** e
        diventa immodificabile.

        Si usa dopo il deposito della bozza. Per l'atto di morte la firma del dichiarante è cartacea:
        si trasmette il verbale firmato come allegato e si registra la firma con
        `codTipoFirma: DICHIARANTE`; la firma dell'Ufficiale è digitale remota e richiede le
        credenziali del provider di firma qualificata, raccolte dalla maschera al momento
        dell'operazione.

        **Le credenziali di firma sono cosa diversa dall'OTP di sessione.** L'OTP di sessione
        autentica le chiamate cooperative e dura quattro ore; le credenziali di firma valgono per il
        singolo atto e comprendono un OTP proprio, emesso dal provider di firma.

        **Effetti**: modifica lo stato in ANSC e nello store locale. **Non ripetibile**: una seconda
        firma sullo stesso atto è respinta. In caso di esito indeterminato accertare lo stato con
        `riconciliaAtto`.

        **Prerequisiti**: sessione OTP valida; atto in stato `CONFERMATO` per la firma del
        dichiarante, `FIRMATO_DICHIARANTE` per quella dell'Ufficiale.

        **La firma non è automatizzabile**: è un atto personale dell'Ufficiale, che ne risponde. Il
        concentratore non firma mai in autonomia.
      tags: [atti]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirmaRichiesta' }
            examples:
              esempioFirmaDichiarante:
                summary: Firma del dichiarante, cartacea
                value:
                  codTipoFirma: DICHIARANTE
                  idAllegatoVerbale: 771204
              esempioFirmaUsc:
                summary: Firma digitale remota dell'Ufficiale
                value:
                  codTipoFirma: USC
                  credenzialiFirma:
                    utenza: usc.roma.014
                    pin: '••••••'
                    codOtpProvider: '739205'
      responses:
        '200':
          description: Esito della firma.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/EsitoFirma' }
              examples:
                esempioAttoFormato:
                  summary: Atto formato
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      idStatoAtto: 550123
                      stato: FIRMATO_USC
                      idAnsc: '2026-058091-000123'
                      dataFirma: '2026-07-23T10:05:10+02:00'
                esempioFirmaRespinta:
                  summary: Credenziali di firma non valide
                  value:
                    esito: KO
                    messaggi:
                      - tipo: ERROR
                        campo: credenzialiFirma.codOtpProvider
                        codice: FIRMA_CREDENZIALI_NON_VALIDE
                        descrizione: Le credenziali di firma non sono state accettate dal provider
                    dati:
                      idStatoAtto: 550123
                      stato: CONFERMATO
        '409':
          description: Sessione OTP non valida, oppure stato dell'atto incompatibile con la firma richiesta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '502': { $ref: '#/components/responses/AnscNonRaggiungibile' }
        '504': { $ref: '#/components/responses/EsitoIndeterminato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC]
      x-effetti: |
        Modifica lo stato in ANSC e nello store locale. **Non ripetibile.** La firma dell'Ufficiale
        rende l'atto immodificabile.
      x-vincoli: |
        Le credenziali di firma non sono mai persistite, né in chiaro né cifrate, e non compaiono
        nelle registrazioni di audit.
      x-codici-errore:
        - codice: FIRMA_CREDENZIALI_NON_VALIDE
          condizione: 'Utenza, PIN o OTP del provider di firma non accettati.'
        - codice: FIRMA_STATO_INCOMPATIBILE
          condizione: 'L''atto non è nello stato che ammette la firma richiesta.'
        - codice: FIRMA_GIA_APPOSTA
          condizione: 'Una firma dello stesso tipo risulta già apposta.'
        - codice: SESSIONE_OTP_ASSENTE
          condizione: 'Nessuna sessione OTP valida per la postazione.'

    get:
      operationId: elencaFirme
      summary: Elenca le firme apposte sull'atto
      description: |
        Restituisce le firme registrate sull'atto, con tipo, firmatario e istante.

        Si usa per ricostruire a che punto del percorso di formazione si trovi l'atto e, dopo un
        esito indeterminato sulla firma, per accertare se la firma sia stata effettivamente apposta.

        **Effetti**: nessuno.
      tags: [atti]
      responses:
        '200':
          description: Elenco delle firme.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati:
                        type: object
                        properties:
                          firme:
                            type: array
                            description: Le firme apposte, in ordine cronologico.
                            items: { $ref: '#/components/schemas/Firma' }
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC, SUPPORTO, AUDITOR]
      x-effetti: Sola lettura, sicura e ripetibile.

  # ------------------------------------------------------------------ annullamento
  /ansc/v1/atti/{idAtto}/annullamento:
    parameters:
      - $ref: '#/components/parameters/IdAtto'
    post:
      operationId: annullaAtto
      summary: Annulla logicamente in ANSC una bozza depositata
      description: |
        Cancella logicamente in ANSC un evento già depositato ma non ancora formato, portandolo allo
        stato `ANNULLATO`.

        Si usa in un solo caso legittimo: quando una riconciliazione ha accertato che un esito
        indeterminato ha prodotto in ANSC un deposito **duplicato**, e occorre eliminare quello di
        troppo.

        **Non è l'annullamento dell'atto di stato civile**, che è un provvedimento con una propria
        disciplina: è la cancellazione logica di una bozza tecnica.

        **Effetti**: modifica lo stato in ANSC. Ripetibile: annullare un evento già annullato
        restituisce l'esito corrente senza effetti ulteriori.

        **Prerequisiti**: sessione OTP valida; l'atto non deve essere già formato. Un atto firmato
        dall'Ufficiale non è annullabile per questa via.

        La precede sempre `riconciliaAtto`: non si annulla nulla senza aver prima accertato lo stato
        reale.
      tags: [atti]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnullamentoRichiesta' }
            examples:
              esempioAnnullamentoDuplicato:
                value:
                  idAnsc: '2026-058091-000124'
                  codMotivo: DUPLICATO_DA_RICONCILIAZIONE
                  note: Deposito duplicato accertato con riconciliazione del 23/07/2026
      responses:
        '200':
          description: Esito dell'annullamento.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/EsitoAnnullamento' }
              examples:
                esempioAnnullato:
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      idAnsc: '2026-058091-000124'
                      stato: ANNULLATO
                      dataAnnullamento: '2026-07-23T11:20:00+02:00'
        '409':
          description: L'atto è già formato e non è annullabile per questa via.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
              examples:
                esempioAttoFormato:
                  value:
                    esito: KO
                    messaggi:
                      - tipo: ERROR
                        codice: ANNULLAMENTO_ATTO_FORMATO
                        descrizione: L'atto è firmato dall'Ufficiale e non è annullabile con questa operazione
                    dati:
                      stato: FIRMATO_USC
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '502': { $ref: '#/components/responses/AnscNonRaggiungibile' }
        '504': { $ref: '#/components/responses/EsitoIndeterminato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC]
      x-effetti: Modifica lo stato in ANSC. Ripetibile senza effetti ulteriori.
      x-codici-errore:
        - codice: ANNULLAMENTO_ATTO_FORMATO
          condizione: 'L''atto è firmato dall''Ufficiale.'
        - codice: SESSIONE_OTP_ASSENTE
          condizione: 'Nessuna sessione OTP valida per la postazione.'

