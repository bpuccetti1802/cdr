openapi: 3.0.3

info:
  title: Integrazione SIPO - ANSC — concentratore operativo
  version: 1.0.0
  summary: Formazione presidiata degli atti di stato civile su ANSC e supervisione del back-office.
  description: |
    Interfacce esposte dal concentratore `all-ansc-sipo`, il componente che media il dialogo fra i
    moduli SIPO e l'Archivio Nazionale dello Stato Civile per tutto ciò che riguarda **la formazione
    dell'atto**.

    Il servizio copre due superfici distinte:

    - le **operazioni applicative**, invocate dalle maschere SIPO durante il percorso presidiato di
      formazione dell'atto (verifica, allegati, deposito della bozza, firme, annullamento);
    - le **operazioni di back-office**, che servono la supervisione delle eccezioni,
      l'amministrazione della configurazione e l'esercizio del componente.

    La formazione dell'atto è un'operazione **presidiata e sincrona**: non esiste alcun invio
    differito verso ANSC, né coda, né ritentativo automatico. Ogni chiamata verso ANSC avviene entro
    la sessione OTP dell'Ufficiale di Stato Civile che sta lavorando l'atto.

    La replica locale delle decodifiche ANSC è servita da un componente distinto, con contratto
    proprio (`ansc-dizionari-v1.yaml`); i percorsi restano nello stesso contesto di dominio.

    Documentazione di analisi: `ANALISI_Integrazione-ANSC_v2.6.docx`. Il rimando è in aggiunta e mai
    in sostituzione: quanto serve a integrare le interfacce è scritto qui.
  contact:
    name: Dipartimento Trasformazione Digitale — Roma Capitale
  x-componente: all-ansc-sipo
  x-standard-nomenclatura: Naming_convention_X_API_v1.00.docx
  x-lingua: it

servers:
  - url: https://sipo-svil.comune.roma.it
    description: Ambiente di sviluppo SIPO (verso preproduzione ANSC o mock locale)
  - url: https://sipo-test.comune.roma.it
    description: Ambiente di test SIPO (verso preproduzione ANSC)
  - url: https://sipo.comune.roma.it
    description: Ambiente di esercizio SIPO (verso produzione ANSC)

tags:
  - name: atti
    description: |
      Il percorso presidiato di formazione dell'atto, nell'ordine in cui le operazioni si susseguono:
      verifica preliminare, allegati, deposito della bozza, firme, annullamento.
  - name: sessione
    description: |
      La sessione OTP dell'operatore. È la risorsa che abilita ogni chiamata verso ANSC: senza una
      sessione valida le operazioni sugli atti che contattano ANSC rispondono `409`.
  - name: eccezioni
    description: Gli atti che non si sono conclusi nel percorso ordinario e richiedono un intervento.
  - name: operazioni
    description: La configurazione per evento, operazione e casistica che guida mappatura e verifica.
  - name: versioni
    description: Le versioni della configurazione e la loro attivazione.
  - name: registrazioni-audit
    description: Le registrazioni delle chiamate verso ANSC, con richiesta e risposta integrali.
  - name: postazioni
    description: Il registro delle postazioni autorizzate, obbligo dell'Allegato 4 del D.M. 18/10/2022.
  - name: sistema
    description: Stato del componente, connettività verso ANSC, versione di configurazione attiva.

security:
  - bearerJwt: []

paths:

  # ------------------------------------------------------------------ sessione
  /ansc/v1/sessione:
    get:
      operationId: leggiSessione
      summary: Legge lo stato della sessione OTP corrente
      description: |
        Restituisce lo stato della sessione OTP dell'operatore autenticato sulla postazione corrente:
        se è valida, quando scade, quanti minuti mancano.

        Si usa all'ingresso nella maschera di formazione dell'atto, per decidere se il pulsante
        «Finalizza» possa procedere direttamente o se occorra prima acquisire un OTP.

        Non modifica alcuno stato e non contatta ANSC: legge lo store di sessione del concentratore.

        La segue `sostituisciSessione` quando la sessione risulta assente o scaduta.
      tags: [sessione]
      responses:
        '200':
          description: Stato della sessione, valida o meno.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/Sessione' }
              examples:
                esempioSessioneValida:
                  summary: Sessione valida
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      flagValida: true
                      idPostazione: PDL-SC-014
                      operatore: VRDGPP75B02H501Z
                      dataScadenza: '2026-07-23T14:02:00+02:00'
                      numMinutiResidui: 118
                esempioSessioneAssente:
                  summary: Nessuna sessione aperta
                  value:
                    esito: OK
                    messaggi:
                      - tipo: INFO
                        codice: SESSIONE_ASSENTE
                        descrizione: Nessuna sessione OTP aperta per questa postazione
                    dati:
                      flagValida: false
                      idPostazione: PDL-SC-014
                      operatore: VRDGPP75B02H501Z
                      dataScadenza: null
                      numMinutiResidui: 0
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC, SUPPORTO, AMMINISTRATORE]
      x-effetti: Operazione di sola lettura, sicura e ripetibile.

    put:
      operationId: sostituisciSessione
      summary: Apre o rinnova la sessione OTP consegnando il codice al concentratore
      description: |
        Consegna al concentratore il codice OTP che l'operatore ha generato sulla web app OTP di
        ANSC, aprendo una nuova sessione presidiata per la coppia operatore-postazione. Se una
        sessione era già aperta, viene sostituita integralmente.

        Si usa quando `leggiSessione` riporta `flagValida: false`, tipicamente all'inizio del turno
        di lavoro o dopo la scadenza delle quattro ore.

        **Effetti**: il codice OTP è custodito dal concentratore per la durata della sessione e usato
        per costruire e firmare i token JWT verso ANSC. Il codice **non transita mai** verso altri
        componenti e non è restituito da alcuna operazione di lettura.

        **Prerequisiti**: la postazione deve essere presente nel registro delle postazioni
        autorizzate; l'operatore deve avere ruolo USC.

        **Il front-end non dialoga con ANSC e non costruisce token**: si limita a consegnare il
        codice con questa operazione.
      tags: [sessione]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessioneRichiesta' }
            examples:
              esempioAperturaSessione:
                summary: Apertura di sessione a inizio turno
                value:
                  codOtp: '482913'
                  idPostazione: PDL-SC-014
      responses:
        '200':
          description: Sessione aperta o rinnovata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/Sessione' }
              examples:
                esempioSessioneAperta:
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      flagValida: true
                      idPostazione: PDL-SC-014
                      operatore: VRDGPP75B02H501Z
                      dataScadenza: '2026-07-23T14:02:00+02:00'
                      numMinutiResidui: 240
        '400':
          description: Codice OTP non accettato da ANSC o postazione non riconosciuta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
              examples:
                esempioOtpRifiutato:
                  summary: OTP non valido
                  value:
                    esito: KO
                    messaggi:
                      - tipo: ERROR
                        campo: codOtp
                        codice: SESSIONE_OTP_NON_VALIDO
                        descrizione: Il codice OTP non è stato accettato da ANSC. Rigenerarlo dalla web app.
                    dati: null
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC]
      x-effetti: |
        Modifica lo stato: apre o sostituisce la sessione. Ripetibile — una seconda consegna dello
        stesso codice rinnova la sessione senza effetti ulteriori. Non transazionale con la pratica.
      x-vincoli: |
        Il codice OTP ha validità di quattro ore, fissata da ANSC e non prorogabile lato SIPO.

    delete:
      operationId: eliminaSessione
      summary: Chiude la sessione OTP corrente
      description: |
        Chiude anticipatamente la sessione OTP dell'operatore sulla postazione corrente, cancellando
        il codice custodito.

        Si usa a fine turno o quando la postazione viene lasciata a un altro operatore.

        **Effetti**: le successive operazioni che contattano ANSC rispondono `409` finché non viene
        aperta una nuova sessione. Non ha alcun effetto sugli atti già formati.
      tags: [sessione]
      responses:
        '204':
          description: Sessione chiusa. Nessun contenuto restituito.
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC]
      x-effetti: 'Modifica lo stato. Ripetibile: chiudere una sessione già chiusa restituisce `204`.'

  # ---------------------------------------------------------------- preverifica
  /ansc/v1/atti/{idAtto}/preverifiche:
    parameters:
      - $ref: '#/components/parameters/IdAtto'
    post:
      operationId: verificaAtto
      summary: Verifica localmente i dati dell'atto prima del deposito
      description: |
        Esegue il **pre-filtro locale** sui dati dell'atto: struttura, obbligatorietà per caso d'uso,
        formati e appartenenza dei codici ai dizionari ANSC replicati in locale. Restituisce gli
        errori campo per campo e l'indicazione se l'atto sia finalizzabile.

        Si usa quando l'operatore preme «Verifica» nella maschera SIPO, prima di poter premere
        «Finalizza».

        **Effetti**: nessuno. L'operazione **non contatta ANSC**, non deposita nulla e non consuma
        alcun identificativo nazionale. È per costruzione ripetibile.

        **Prerequisiti**: l'atto deve essere salvato in SIPO; deve esistere una configurazione attiva
        per la terna evento-operazione-casistica.

        **Che cosa non intercetta**: le regole che dipendono dallo stato centrale — esistenza e stato
        di un atto collegato formato altrove, adesione ad ANSC del comune destinatario,
        riconciliazione del soggetto, posizione anagrafica ANPR, unicità della numerazione. Quelle
        restano di competenza esclusiva del deposito. Un esito `OK` qui **non garantisce** che il
        deposito sarà accettato.

        La segue `depositaBozza`.
      tags: [atti]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreverificaRichiesta' }
            examples:
              esempioPreverificaMorte:
                summary: Atto di morte, dichiarazione in abitazione
                value:
                  idAttoSipo: 88012
                  codTipoEvento: MORTE
                  codTipoOperazione: CREAZIONE
                  codCasistica: DICH_ABITAZIONE
                  codVersioneConfig: v.12
      responses:
        '200':
          description: |
            Esito della verifica. La busta riporta `OK` se l'atto è finalizzabile, `KO` se restano
            errori bloccanti: in entrambi i casi il codice di stato HTTP è `200`, perché
            l'operazione è stata eseguita correttamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/EsitoPreverifica' }
              examples:
                esempioPreverificaSuperata:
                  summary: Verifica superata
                  value:
                    esito: OK
                    messaggi:
                      - tipo: INFO
                        codice: PREVERIFICA_SUPERATA
                        descrizione: Preverifica superata
                    dati:
                      flagFinalizzabile: true
                      codEventoAnsc: Morte_001
                      numCampiVerificati: 34
                      codVersioneConfig: v.12
                esempioPreverificaRespinta:
                  summary: Campi obbligatori mancanti
                  value:
                    esito: KO
                    messaggi:
                      - tipo: ERROR
                        campo: evento.intestatari[0].idNazionalita
                        codice: OBBL_MANCANTE
                        descrizione: Cittadinanza del defunto obbligatoria
                      - tipo: ERROR
                        campo: evento.intestatari[0].idstatocivile
                        codice: OBBL_MANCANTE
                        descrizione: Stato civile del defunto obbligatorio
                      - tipo: WARNING
                        campo: evento.intestatari[0].codiceFiscale
                        codice: FORMATO_NON_VALIDO
                        descrizione: Codice fiscale formalmente non valido
                    dati:
                      flagFinalizzabile: false
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC, SUPPORTO]
      x-effetti: |
        Nessuna modifica di stato, né locale né in ANSC. Ripetibile senza limiti.
      x-codici-errore:
        - codice: OBBL_MANCANTE
          condizione: 'Campo dichiarato obbligatorio dalla configurazione e non valorizzato.'
        - codice: FORMATO_NON_VALIDO
          condizione: 'Valore presente ma non conforme al formato atteso.'
        - codice: DECODIFICA_NON_AMMESSA
          condizione: 'Codice non presente fra i valori validi del dizionario ANSC associato al campo.'
        - codice: CONFIG_ASSENTE
          condizione: 'Nessuna configurazione attiva per la terna evento-operazione-casistica.'

  # -------------------------------------------------------------------- allegati
  /ansc/v1/atti/{idAtto}/allegati:
    parameters:
      - $ref: '#/components/parameters/IdAtto'
    post:
      operationId: creaAllegato
      summary: Trasmette un allegato dell'atto ad ANSC
      description: |
        Trasmette ad ANSC un documento da allegare all'atto e ne registra l'identificativo restituito.
        ANSC sottopone il documento a **scansione antivirus asincrona**: l'allegato non è utilizzabile
        finché la scansione non risulta superata.

        Si usa nel passo degli allegati del percorso di formazione, prima del deposito della bozza,
        e per il verbale di morte firmato dal dichiarante, che per questo evento è cartaceo.

        **Effetti**: crea una risorsa allegato lato ANSC. **L'operazione non è idempotente**: ANSC non
        espone alcuna chiave di deduplica, quindi una seconda trasmissione dello stesso documento
        produce un secondo allegato. In caso di esito indeterminato non ripetere: elencare gli
        allegati con `elencaAllegati` e verificare che cosa sia stato effettivamente acquisito.

        **Prerequisiti**: sessione OTP valida.

        La segue `leggiAllegato`, da interrogare finché la scansione non risulta conclusa.
      tags: [atti]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllegatoRichiesta' }
            examples:
              esempioVerbaleMorte:
                summary: Verbale di morte firmato dal dichiarante
                value:
                  codTipoAllegato: VERBALE_DICHIARAZIONE
                  nomeFile: verbale-88012.pdf
                  codTipoContenuto: application/pdf
                  contenutoBase64: JVBERi0xLjQKJcfsj6IKNSAwIG9iago8PC9MZW5ndGgg...
      responses:
        '201':
          description: Allegato trasmesso e in corso di verifica.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/Allegato' }
              examples:
                esempioAllegatoAcquisito:
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      idAllegato: 771204
                      idAllegatoAnsc: '2026-058091-A-000045'
                      codTipoAllegato: VERBALE_DICHIARAZIONE
                      nomeFile: verbale-88012.pdf
                      codStatoVerifica: IN_CORSO
                      dataTrasmissione: '2026-07-23T10:02:20+02:00'
        '400':
          description: Documento rifiutato da ANSC (tipo non ammesso, dimensione eccedente, formato illeggibile).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Busta' }
              examples:
                esempioTipoNonAmmesso:
                  value:
                    esito: KO
                    messaggi:
                      - tipo: ERROR
                        campo: codTipoAllegato
                        codice: ALLEGATO_TIPO_NON_AMMESSO
                        descrizione: Tipo di allegato non previsto per il caso d'uso Morte_001
                    dati: null
        '409': { $ref: '#/components/responses/SessioneNonValida' }
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '502': { $ref: '#/components/responses/AnscNonRaggiungibile' }
        '504': { $ref: '#/components/responses/EsitoIndeterminato' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC]
      x-effetti: |
        Modifica lo stato in ANSC creando l'allegato. **Non ripetibile senza effetti ulteriori.**
      x-vincoli: |
        Dimensione massima del documento e tipi ammessi sono fissati dal contratto ANSC per caso
        d'uso. Il limite puntuale è da confermare con il fornitore.
      x-codici-errore:
        - codice: ALLEGATO_TIPO_NON_AMMESSO
          condizione: 'Tipo di allegato non previsto per il caso d''uso.'
        - codice: ALLEGATO_TROPPO_GRANDE
          condizione: 'Dimensione oltre il limite ammesso da ANSC.'
        - codice: SESSIONE_OTP_ASSENTE
          condizione: 'Nessuna sessione OTP valida per la postazione.'

    get:
      operationId: elencaAllegati
      summary: Elenca gli allegati dell'atto e il loro stato di verifica
      description: |
        Restituisce gli allegati trasmessi per l'atto, con lo stato della scansione antivirus di
        ciascuno.

        Si usa per sapere se si possa procedere al deposito e, dopo un esito indeterminato su
        `creaAllegato`, per accertare che cosa sia stato effettivamente acquisito da ANSC prima di
        decidere se ritrasmettere.

        **Effetti**: nessuno. Interroga ANSC in sola lettura.
      tags: [atti]
      responses:
        '200':
          description: Elenco degli allegati dell'atto.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati:
                        type: object
                        properties:
                          allegati:
                            type: array
                            description: Gli allegati dell'atto, dal più recente.
                            items: { $ref: '#/components/schemas/Allegato' }
        '409': { $ref: '#/components/responses/SessioneNonValida' }
        '404': { $ref: '#/components/responses/NonTrovato' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '502': { $ref: '#/components/responses/AnscNonRaggiungibile' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC, SUPPORTO]
      x-effetti: Sola lettura, sicura e ripetibile.

  /ansc/v1/atti/{idAtto}/allegati/{idAllegato}:
    parameters:
      - $ref: '#/components/parameters/IdAtto'
      - $ref: '#/components/parameters/IdAllegato'
    get:
      operationId: leggiAllegato
      summary: Legge lo stato di verifica di un allegato
      description: |
        Restituisce il singolo allegato con l'esito della scansione antivirus: in corso, superata o
        respinta.

        Si usa in attesa dell'esito della scansione, che ANSC esegue in modo asincrono. Il front-end
        interroga a intervalli finché lo stato non è definitivo; solo con la scansione superata il
        percorso può proseguire verso il deposito.

        **Effetti**: nessuno.
      tags: [atti]
      responses:
        '200':
          description: Stato dell'allegato.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Busta'
                  - type: object
                    properties:
                      dati: { $ref: '#/components/schemas/Allegato' }
              examples:
                esempioScansioneSuperata:
                  summary: Scansione conclusa positivamente
                  value:
                    esito: OK
                    messaggi: []
                    dati:
                      idAllegato: 771204
                      idAllegatoAnsc: '2026-058091-A-000045'
                      codTipoAllegato: VERBALE_DICHIARAZIONE
                      nomeFile: verbale-88012.pdf
                      codStatoVerifica: SUPERATA
                      dataTrasmissione: '2026-07-23T10:02:20+02:00'
                esempioScansioneRespinta:
                  summary: Documento respinto dalla scansione
                  value:
                    esito: KO
                    messaggi:
                      - tipo: ERROR
                        codice: ALLEGATO_SCANSIONE_RESPINTA
                        descrizione: Il documento non ha superato la scansione antivirus. Ritrasmettere un file diverso.
                    dati:
                      idAllegato: 771204
                      codStatoVerifica: RESPINTA
        '404': { $ref: '#/components/responses/NonTrovato' }
        '409': { $ref: '#/components/responses/SessioneNonValida' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '502': { $ref: '#/components/responses/AnscNonRaggiungibile' }
        '500': { $ref: '#/components/responses/ErroreInterno' }
      x-ruoli: [USC, SUPPORTO]
      x-effetti: Sola lettura, sicura e ripetibile.
      x-vincoli: |
        L'interrogazione ripetuta va temporizzata. In assenza di un limite dichiarato da ANSC si
        raccomanda un intervallo non inferiore a due secondi.

  # -------------------------------------------------------------------- deposito
  /ansc/v1/atti/{idAtto}/deposito:
    parameters:
      - $ref: '#/components/parameters/IdAtto'
    post:
      operationId: depositaBozza
      summary: Deposita la bozza dell'atto in ANSC e ne ottiene l'identificativo nazionale
      description: |
        Sottopone l'atto alla validazione di ANSC. Se la validazione è superata, **la bozza è
        depositata** sul sistema nazionale e ANSC restituisce l'**identificativo nazionale
        dell'atto**; lo stato locale passa a `CONFERMATO`.

        Si usa alla pressione di «Finalizza», dopo che la verifica preliminare è stata superata e gli
        allegati hanno passato la scansione.

        **La validazione non è una prova a vuoto**: se va a buon fine deposita e consuma un
        identificativo nazionale. È la ragione per cui la precede sempre `verificaAtto`.

        **Effetti**: modifica lo stato in ANSC e, nella stessa transazione locale, lo store di stato
        dell'atto. **Non ripetibile**: ANSC non espone alcuna chiave di deduplica, quindi un secondo
        deposito produrrebbe un secondo atto nazionale. In caso di esito indeterminato **non
        ritentare**: usare `riconciliaAtto` per accertare lo stato reale.

        Se la validazione è respinta ANSC risponde con errore e **non crea nulla**: nessun
        identificativo è consumato, l'atto resta `IN_PREPARAZIONE` e va corretto nella maschera SIPO.

        **Prerequisiti**: sessione OTP valida; verifica preliminare superata; allegati con scansione
        superata.

        Lo segue `firmaAtto`.
      tags: [atti]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositoRichiesta' }
            examples:
              esempioDepositoMorte:
                value:
                  idAttoSipo: 88012
                  codTipoEvento: MORTE
                  codTipoOperazione: CREAZIONE
