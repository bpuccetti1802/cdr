        l'identificativo nazionale se assegnato.

        Si usa per mostrare nella maschera SIPO l'indicatore di stato dell'atto e per decidere quali
        azioni proporre all'operatore.

        **Legge lo store locale, non ANSC.** Per accertare lo stato reale sul sistema nazionale si usa
        `riconciliaAtto`.

        **Effetti**: nessuno.
      tags: [atti]
      responses:
        '200':
          description: Stato dell'atto.
          content:
