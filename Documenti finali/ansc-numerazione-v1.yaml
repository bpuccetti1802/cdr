openapi: 3.0.3

info:
  title: Integrazione SIPO - ANSC — servizio della numerazione comunale
  version: 1.2.0
  summary: Stacco dei numeri comunali consecutivi, ricerca e cambio di stato.
  description: |
    Interfacce esposte dal servizio `be-numeratore-comunale`, che governa la **serie dei numeri
    comunali** degli atti di stato civile: il progressivo che il Comune assegna a ciascun atto e
    che viaggia nel modello evento verso ANSC.

    Nessun servizio di ANSC attribuisce il numero comunale: la piattaforma lo riceve e lo compone
    nell'identificativo nazionale. Il servizio non parla con ANSC e non detiene credenziali verso
    la piattaforma.

    La gestione è ereditata dal sistema Side del Comune di Milano, con le sue tabelle
    (`PRENOTAZIONE_ATTI`, `DATI_ATTO_ESTERNO`) e i suoi quattro stati del numero. La serie è tenuta
    dalla tabella `NUMERATORE_COMUNALE`, una riga per anno; uno stacco avviene in un'unica
    transazione, e in caso di errore il contatore non avanza.

    Le operazioni sono quattro: lo stacco, la ricerca e i due cambi di stato. La chiave di un numero
    è la coppia (idRichiesta, numero); nei corpi delle operazioni PUT la stessa coppia si chiama
    (idPrenotazioneAtti, numeroAttoComunale).

    ## Gli stati del numero

    - **1 disponibile** — alla creazione: un numero nasce sempre in questo stato (POST /richiesta);
    - **2 utilizzato** — PUT /utilizza;
    - **3 scartato** — PUT /scarta;
    - **4 evento acquisito** — non viene impostato da questi servizi.

    ## Che cosa il servizio non dichiara

    Autenticazione e ruoli ammessi non sono dichiarati dal servizio. L'operatore della richiesta è
    oggi sempre "admin".

    Documentazione di analisi: `ANALISI_Integrazione-ANSC_v3.54.docx`, capitolo «La numerazione
    comunale».
  contact:
    name: Dipartimento Trasformazione Digitale — Roma Capitale
  x-componente: be-numeratore-comunale
  x-standard-nomenclatura: Naming_convention_X_API_v1.00.docx
  x-lingua: it

servers:
  - url: https://sipo-svil.comune.roma.it
    description: Ambiente di sviluppo SIPO
  - url: https://sipo-test.comune.roma.it
    description: Ambiente di test SIPO
  - url: https://sipo.comune.roma.it
    description: Ambiente di esercizio SIPO

tags:
  - name: numerazione-comunale
    description: |
      I numeri comunali: lo stacco di uno o più numeri consecutivi, la ricerca dei numeri
      staccati e il loro cambio di stato.

paths:

  /api/v1/numerazione-comunale/richiesta:
    post:
      operationId: creaRichiesta
      summary: Stacca uno o più numeri consecutivi
      description: |
        Stacca uno o più numeri comunali consecutivi, registra la richiesta e crea un record per
        ogni numero in stato 1 (disponibile).

        **Effetti**: tutto avviene in un'unica transazione: in caso di errore il contatore non
        avanza.

        Il corpo è obbligatorio, con entrambi i campi.
      tags: [numerazione-comunale]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RichiestaNumeri' }
            examples:
              esempioTreNumeri:
                summary: Tre numeri dell'anno 2026
                value:
                  anno: 2026
                  numeroElementi: 3
      responses:
        '200':
          description: Una voce per ogni numero staccato.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NumerazioneComunaleRispostaDTO' }
              examples:
                esempioNumeriStaccati:
                  summary: Numeri staccati
                  value:
                    - { idRichiesta: 120, operatore: admin, dataRichiesta: 26/10/2026, anno: 2026, numero: 501, idAnsc: null, stato: '1', idAttoSipo: null }
                    - { idRichiesta: 120, operatore: admin, dataRichiesta: 26/10/2026, anno: 2026, numero: 502, idAnsc: null, stato: '1', idAttoSipo: null }
        '400':
          description: |
            Corpo mancante; anno mancante ("Anno obbligatorio"); numeroElementi mancante ("Numero
            elementi obbligatorio"); anno fuori intervallo ("L'anno deve essere tra 2023 e 9999");
            numeroElementi fuori intervallo ("Il numero di elementi deve essere tra 1 e 999").
      x-sicurezza: Non dichiarata dal servizio.
      x-effetti: |
        Crea la richiesta e i suoi numeri nello stato 1 (disponibile) e fa avanzare il contatore
        dell'anno, nella stessa transazione. Non ripetibile senza effetti: ogni chiamata stacca
        numeri nuovi.

  /api/v1/numerazione-comunale/ricerca:
    get:
      operationId: cercaNumeri
      summary: Ricerca paginata dei numeri staccati
      description: |
        Ricerca paginata dei numeri staccati. Ogni filtro non valorizzato viene ignorato.

        **Effetti**: nessuno.
      tags: [numerazione-comunale]
      parameters:
        - { name: anno, in: query, required: false, description: 'Filtro sull''anno di numerazione.', schema: { type: integer } }
        - { name: stato, in: query, required: false, description: 'Filtro sullo stato del numero (1, 2, 3, 4).', schema: { type: string } }
        - { name: idRichiesta, in: query, required: false, description: 'Filtro sulla richiesta.', schema: { type: integer, format: int64 } }
        - { name: idAttoSipo, in: query, required: false, description: 'Filtro sull''atto di SIPO.', schema: { type: integer, format: int64 } }
        - { name: numero, in: query, required: false, description: 'Filtro sul numero comunale.', schema: { type: integer } }
        - { name: richiestaDa, in: query, required: false, description: 'Data della richiesta maggiore o uguale (inclusa), nella forma yyyy-MM-dd.', schema: { type: string, format: date } }
        - { name: richiestaA, in: query, required: false, description: 'Data della richiesta minore o uguale (inclusa l''intera giornata), nella forma yyyy-MM-dd.', schema: { type: string, format: date } }
        - { name: operatore, in: query, required: false, description: 'Filtro per uguaglianza esatta sull''operatore della richiesta.', schema: { type: string } }
        - { name: pageOffset, in: query, required: false, description: 'Numero di pagina, in base 0; deve essere maggiore o uguale a 0.', schema: { type: integer, default: 0 } }
        - { name: pageSize, in: query, required: false, description: 'Elementi per pagina; deve essere maggiore o uguale a 1.', schema: { type: integer, default: 10 } }
      responses:
        '200':
          description: Pagina di risultati (PagedModel di NumerazioneComunaleRispostaDTO).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaNumeri' }
              examples:
                esempioRicerca:
                  summary: GET /api/v1/numerazione-comunale/ricerca?anno=2026&stato=1&pageOffset=0&pageSize=20
                  value:
                    content:
                      - { idRichiesta: 120, operatore: admin, dataRichiesta: 26/10/2026, anno: 2026, numero: 501, idAnsc: null, stato: '1', idAttoSipo: null }
                    page: { size: 20, number: 0, totalElements: 1, totalPages: 1 }
        '400':
          description: pageOffset negativo o pageSize minore di 1; richiestaDa successiva a richiestaA.
      x-sicurezza: Non dichiarata dal servizio.
      x-effetti: Sola lettura, sicura e ripetibile.

  /api/v1/numerazione-comunale/utilizza:
    put:
      operationId: utilizzaNumero
      summary: Porta un numero allo stato utilizzato
      description: |
        Segna il numero come utilizzato (stato 2) e, se indicato, registra l'atto SIPO che lo ha
        usato.

        idAttoSipo viene sempre scritto sul record; se è omesso nel corpo, il valore salvato è null.

        **Effetti**: modifica lo stato del numero.
      tags: [numerazione-comunale]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UtilizzoNumero' }
            examples:
              esempioUtilizzo:
                value:
                  idPrenotazioneAtti: 120
                  numeroAttoComunale: 501
                  idAttoSipo: 98765
      responses:
        '204':
          description: Numero segnato come utilizzato; nessun contenuto.
        '400':
          description: idPrenotazioneAtti o numeroAttoComunale mancanti.
        '404':
          description: Numero non trovato per quella richiesta.
      x-sicurezza: Non dichiarata dal servizio.
      x-effetti: |
        Porta il numero allo stato 2 e scrive idAttoSipo, anche nullo. Ripetere la chiamata
        riscrive gli stessi valori.

  /api/v1/numerazione-comunale/scarta:
    put:
      operationId: scartaNumero
      summary: Porta un numero allo stato scartato
      description: |
        Segna il numero come scartato (stato 3): non verrà usato.

        **Effetti**: modifica lo stato del numero.
      tags: [numerazione-comunale]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScartoNumero' }
            examples:
              esempioScarto:
                value:
                  idPrenotazioneAtti: 120
                  numeroAttoComunale: 502
      responses:
        '204':
          description: Numero segnato come scartato; nessun contenuto.
        '400':
          description: Campi obbligatori mancanti.
        '404':
          description: Numero non trovato per quella richiesta.
      x-sicurezza: Non dichiarata dal servizio.
      x-effetti: Porta il numero allo stato 3. Ripetere la chiamata non produce effetti ulteriori.

components:

  schemas:

    RichiestaNumeri:
      type: object
      description: Il corpo dello stacco.
      required: [anno, numeroElementi]
      properties:
        anno:
          type: integer
          minimum: 2023
          maximum: 9999
          description: Anno di numerazione, da 2023 a 9999.
        numeroElementi:
          type: integer
          minimum: 1
          maximum: 999
          description: Quanti numeri consecutivi staccare, da 1 a 999.

    NumerazioneComunaleRispostaDTO:
      type: object
      description: Un numero staccato. Lo restituiscono POST /richiesta (uno per numero staccato) e GET /ricerca (dentro la pagina di risultati).
      properties:
        idRichiesta: { type: integer, format: int64, description: 'PRENOTAZIONE_ATTI.ID_PRENOTAZIONE_ATTI.' }
        operatore: { type: string, description: 'Operatore della richiesta (oggi sempre "admin").' }
        dataRichiesta: { type: string, description: 'Data della richiesta, nel formato gg/MM/yyyy.' }
        anno: { type: integer, description: 'Anno di numerazione.' }
        numero: { type: integer, description: 'Numero comunale.' }
        idAnsc: { type: string, nullable: true, description: 'Identificativo ANSC; null in risposta a /richiesta.' }
        stato: { type: string, enum: ['1', '2', '3', '4'], description: 'Codice dello stato: 1 disponibile, 2 utilizzato, 3 scartato, 4 evento acquisito.' }
        idAttoSipo: { type: integer, format: int64, nullable: true, description: 'DATI_ATTO_ESTERNO.ID_ATTO_SIPO; null se il numero non è assegnato a un atto.' }

    PaginaNumeri:
      type: object
      description: PagedModel di NumerazioneComunaleRispostaDTO.
      properties:
        content:
          type: array
          description: I numeri della pagina richiesta.
          items: { $ref: '#/components/schemas/NumerazioneComunaleRispostaDTO' }
        page: { $ref: '#/components/schemas/MetadatiPagina' }

    MetadatiPagina:
      type: object
      description: Dati di navigazione della pagina.
      properties:
        size: { type: integer, description: 'Elementi per pagina.' }
        number: { type: integer, description: 'Numero della pagina, in base 0.' }
        totalElements: { type: integer, description: 'Elementi totali che soddisfano i filtri.' }
        totalPages: { type: integer, description: 'Pagine totali.' }

    UtilizzoNumero:
      type: object
      description: Il corpo di PUT /utilizza.
      required: [idPrenotazioneAtti, numeroAttoComunale]
      properties:
        idPrenotazioneAtti: { type: integer, format: int64, description: 'Corrisponde a idRichiesta.' }
        numeroAttoComunale: { type: integer, description: 'Corrisponde a numero.' }
        idAttoSipo: { type: integer, format: int64, nullable: true, description: 'Atto che ha usato il numero.' }

    ScartoNumero:
      type: object
      description: Il corpo di PUT /scarta.
      required: [idPrenotazioneAtti, numeroAttoComunale]
      properties:
        idPrenotazioneAtti: { type: integer, format: int64, description: 'Corrisponde a idRichiesta.' }
        numeroAttoComunale: { type: integer, description: 'Corrisponde a numero.' }
